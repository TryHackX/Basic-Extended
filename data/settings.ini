[Reservation]
; The last Slots slots are kept for the players of File (a Steam id or an IP at the start of each
; line; with AdminsToo also those of Admins_Steam.txt). Somebody else who takes one of them is kicked
; with Text - once Steam has confirmed him or up to 8 seconds after the join. Names and computer ids
; can be faked, so they do not count. Token {slots}
Enabled = 0
Slots = 2
File = Reserved.txt
AdminsToo = 1
Text = The server is full: the last {slots} slots are reserved.

[Logger]
; A log file a day in Folder (yyyy-mm-dd.txt, relative to the server folder), written by the
; library's thread: joins and leaves, team changes and Steam logins (Joins), chat (Chat), the players'
; commands (Commands; a password after /adminlog is never written), the server console and TCP admins
; (Admins), map changes (Maps), kills (Kills). The players of WatchFile (a Steam id, an IP or a name
; per line) also get their own file in Folder/watched.
Enabled = 0
Folder = logs/basic-extended/
Joins = 1
Chat = 1
Commands = 1
Admins = 1
Maps = 1
Kills = 0
WatchFile = Watched.txt

; ----------------------------------------------------------------------------------------------------
;  Admin commands (in game with /, and the server console where it makes sense)
; ----------------------------------------------------------------------------------------------------

[Admin]
; Players whose Steam id is in this file (one at the start of a line, any form, the rest of the line is
; a comment) become admins once Steam confirms them - an HWID can be faked, a Steam account cannot.
; Soldat keeps admins by IP: the server writes the IP into remote.txt; the script takes it out again
; when the player leaves (only an IP it put there itself, listed in data/granted_admins.txt).
SteamFile = Admins_Steam.txt
; /steamadmin - the list; /steamadmin add|del <player or Steam id>. Only from the server console, a TCP
; admin or a Steam admin of this file.
SteamAdminCommands = steamadmin
; The list shown by /admincommands
ListCommands = admincommands
ListFile = Admins_Commands.txt
ListColorsInFile = 0
IpCommands = ip
HwidCommands = hwid
; /banr <id> <time> <reason>, /banhwr <time> <hwid> <reason>, /banipr <time> <ip> <reason>;
; time = number + m, h, d, mon or y
BanCommands = banr|banrange|bantime
BanHwidCommands = banhwr
BanIpCommands = banipr
; longest ban in minutes (0 = no limit) and 1 = a longer one is shortened, 0 = refused
MaxBanMinutes = 129600
ShortenLongBans = 1
KillAllCommands = killall
KickAllCommands = kickall
ExplodeAllCommands = explodeall
; /killall and /kickall leave the admins alone (1) or not (0)
KillAllSkipsAdmins = 0
KickAllSkipsAdmins = 1
; Every command that takes a player takes: an id, a name or a part of it ("in quotes" with spaces),
; me, all, others (everybody but you), alpha, bravo, charlie, delta, spec, bots or humans.
; /explode <player> [kind], /god [player] (no damage), /heal <player>, /slap <player> [damage],
; /freeze <player> (again = free), /bring <player> (to you), /goto <player>, /disarm <player>,
; /give [near] <player> [ammo] <weapon> - weapon: usp deagle mp5 ak aug spas ruger m79 barrett minimi
;   minigun knife chainsaw law flamer bow flamebow or 0-16; ammo = rounds in the magazine (at most a
;   full one); near = the weapon drops next to the player instead,
; /bonus [near] <player> <predator|berserker|vest|nades|clusters|flame|medkit or 1-7> - given at once
;   (near: the kit drops next to the player),
; /statgun [player] - a stationary gun next to you (or the player); /removestatgun [all] - the one
;   nearest to you (or all of them),
; /infammo <player> - infinite ammo on/off (the magazine is filled again, a thrown knife comes back),
; /dmgfix <player> <+n%|-n%|n%|xN|off> - the damage the player's bullets do (+20% = 120%),
; /dmgtaken <player> <...> - the damage the player takes (both together multiply),
; /vest <player> [0-100] - body armour.
; The server itself bans a player for a day for a bow outside Rambo mode, admins too ("Not allowed
; weapon"), so /give refuses it. A server with sv_bonus_flamer 1 does the same for a flamer (also the
; flame god bonus); set GiveFlamer = 1 when yours has sv_bonus_flamer 0.
; Kinds of /explode (and /explodeall [kind]): plain, big (a big blast with rings of explosions,
; shrapnel and fire), nuke (three rings of blasts and rockets falling from the sky), law (rockets from
; six sides), m79 (shells from above), arrows, firearrows, bullets, spas (shotgun shells from four
; sides), flame, cluster, nades (a fan of grenades), knives, rain (bullets from the sky).
; /bigexplode <player> = /explode <player> big, /nuke <player> = /explode <player> nuke.
; ExplodePower (0.1-10) multiplies the damage of every kind. Script bullets never fill the game's 254
; bullet slots (32 are kept free), and no object is made when fewer than 4 of the 90 slots are free.
ExplodeCommands = explode
BigExplodeCommands = bigexplode|boom
NukeCommands = nuke
ExplodePower = 1
GodCommands = god
HealCommands = heal
SlapCommands = slap
SlapDamage = 15
FreezeCommands = freeze
BringCommands = bring
GotoCommands = goto
DisarmCommands = disarm
GiveCommands = give
BonusCommands = bonus
GiveFlamer = 0
StatgunCommands = statgun|sg
StatgunRemoveCommands = removestatgun|delstatgun
InfAmmoCommands = infammo|infiniteammo
DamageCommands = dmgfix|dmgmod
DamageTakenCommands = dmgtaken
VestCommands = vest
RandomizeCommands = randomize
ReloadCommands = reloadsettings|be_reload
; what the script sent in the last minutes (health texts, damage numbers, heals, bullets looked at)
StatusCommands = be_status
; Testing aids, only from the server console or a TCP admin connection:
; /be_test <player id> <chat line or /command> runs it as that player, the answers also go to the
; console; /be_bench measures the bullet scan, the kit sweep, a property read, the snapshot of the
; players for the library and the cost of a library call (the server stands still for about a
; second: use it on a test server)
TestCommands = be_test
BenchCommands = be_bench

[Teleport]
; Three ways for an admin to move to the cursor with Key (reload, grenade, throw or changeweapon; the
; key keeps doing its own job too), each switched on and off by its command (and off at every join).
; The key is read every tick; the game sends it with the player's movement packets.
;   /tele         a press: jump there and stop
;   /teletomouse  a tap: jump there and keep flying that way (the speed you had * MomentumKeep, plus
;                 MomentumBase, plus MomentumPerPixel for every pixel of the jump, at most MomentumMax).
;                 Held for HoldTicks ticks or longer: you fly where the cursor points - move the mouse
;                 to the other side and you turn round (HoldSteer, 0.01-1, is how much of a turn is taken
;                 each tick) - with a jump towards the cursor at most every HopTicks ticks (and not
;                 before your ping has passed) when it is HopMinPixels or more away (HopMaxPixels at
;                 most), and a push every PushTicks ticks in between. After a jump the game's camera
;                 lags behind for a moment, so the cursor seems to be behind you: that is left out.
;                 /teletomouse inherit: the longer you hold, the faster you fly - InheritAccel pixels a
;                 tick more every second and InheritGain more for every jump, at most InheritMax.
;                 /teletomouse fixed: the speed by the distance to the cursor.
;                 HoldSpeed is the variant a plain /teletomouse starts with.
;   /flytomouse   no jump: while the key is held, every FlyEveryTicks a push towards the cursor of
;                 FlyBase + FlyPerPixel per pixel beyond FlyDeadZone (at most FlyMax); with the cursor
;                 within FlyDeadZone pixels of the soldier you hover. FlySmooth (0.05-1) is how much of
;                 a change of the direction is taken at once (less = steadier).
; Speeds are pixels a tick; the game allows 11 on each axis (15.5 diagonally). Not into a wall with
; NotIntoWalls = 1 (checked by basicext_dll when [MapGeometry] read the map).
Enabled = 1
Commands = tele|tp
MomentumCommands = teletomouse|ttm
FlyCommands = flytomouse|ftm
Key = reload
NotIntoWalls = 1
MomentumBase = 2
MomentumPerPixel = 0.008
MomentumKeep = 1
MomentumMax = 11
HoldTicks = 15
HoldSteer = 0.3
HopTicks = 6
HopMinPixels = 24
HopMaxPixels = 600
PushTicks = 3
HoldSpeed = inherit
InheritAccel = 4
InheritGain = 0.6
InheritMax = 11
FlyBase = 1.5
FlyPerPixel = 0.04
FlyMax = 11
FlyEveryTicks = 2
FlyDeadZone = 8
FlySmooth = 0.5

[Trajectory]
; /trajectory - where the bullets of your weapon fly, as dots from the gun (green = where they hit a
; wall); /trajectory <player> - the flight of that player's bullets (with the cursor); again or
; /trajectory off stops it. Worked out in basicext_dll from the weapons of the server (see [Weapons]): speed, gravity,
; the speed of the soldier the bullet takes along, the gun's place for standing, crouching and prone.
; Drawn every UpdateTicks ticks (1-60) up to Range pixels, Dots dots at most (2-60) out of points
; Spacing pixels apart. The path is worked out again only when the position, speed, cursor, weapon or
; stance changed. The dots go out together (at most TextsPerUpdate texts at a time, 1-64; keep it
; above Dots), and only when the path moved more than MovePixels. WorldText layers LayerFirst ..
; LayerFirst+Dots.
; ViewOnly = 1: the dots cover only the part of the path the watcher can see: the screen around the
; camera, which the game keeps between the soldier and the cursor (a Barrett zoom or a bullet the
; camera follows moves it further out), with ViewMargin pixels more on each side. Without
; [MapGeometry] the walls come from the script (slower).
; Soldat sends the cursor to the server only now and then (after the mouse moved 30 pixels or more),
; so the path shows where the server thinks you aim: an M79 or a far shot can land a little off.
Enabled = 1
Commands = trajectory|traj
UpdateTicks = 5
Dots = 16
Spacing = 16
Range = 2500
TextsPerUpdate = 20
MovePixels = 2
LayerFirst = 100
Scale = 0.08
CursorScale = 0.1
Color = $FF3030
HitColor = $33CC00
CursorColor = $DCB201
ViewOnly = 1
ViewMargin = 25

[Aimbot]
; /aimbot [on|off|cursor|nearest|acc <0-100>] - for admins: while Key (crouch, jet, prone or fire) is
; held, new bullets of the weapon in hand fly at an enemy: Target = cursor - the one nearest to the
; cursor within MaxAngle degrees of it, nearest - the nearest one. The shot leads a moving target
; (worked out in basicext_dll with the bullet's speed and gravity) and goes only when no wall is in
; the way, up to Range pixels, at the fire rate and start-up time of the weapon. Every shot takes a
; round of the weapon's own magazine and the game reloads it (InfiniteAmmo = 1 or /infammo: no).
; Spread (0-100) is the share of the weapon's own inaccuracy, as the game works it out (standing,
; crouching, prone, running, jumping); 0 = every shot exact, each admin may change it with /aimbot acc.
; With Key = fire the weapon fires too, but its own bullets do no damage while the aimbot is on.
; Sound = 1: the shot is heard up to SoundRange pixels.
Enabled = 1
Commands = aimbot
Key = crouch
Target = cursor
MaxAngle = 70
Range = 900
Spread = 0
InfiniteAmmo = 0
Sound = 1
SoundRange = 900

[Weapons]
; The weapons file of the server for the trajectory and the aimbot: auto = configs/weapons.ini (or
; weapons.ini), in realistic mode configs/weapons_realistic.ini; files of older servers (speeds * 10)
; are read too. Without a file the weapons of Soldat 1.7.1 are used.
File = auto
RealisticFile = auto

[AntiCheat]
; Numbers for the admins, worked out in basicext_dll from what the server sees; nobody is kicked or
; banned by it. /suspects [all] - the players of this game by suspicion; /acstats <player> - this game
; and all games of that computer (kept in data/players.bdb); /acclear <player|all> [forever] - forget.
; What is measured:
;  - start-up: a Barrett (or LAW) bullet that comes sooner after the fire key than the weapon's
;    StartUpTime allows, less StartUpSlack ticks (the key reaches the server with the movement packets,
;    up to 4 ticks late; a packet lost on the way can make one honest shot look short, so look at the
;    share: a cheat without start-up is short every time);
;  - fast shots: two bullets of a weapon with a long fire interval (20 ticks or more) closer together
;    than FireIntervalShare of it;
;  - jumps: a living player who moved further than the game allows (11 px a tick on each axis) between
;    two looks at the positions (every PositionTicks), with JumpLagTicks of lag and JumpPixels more;
;    moves by this script (teleport, /bring, /goto, freeze, respawn) are left out for MovedGraceTicks;
;  - hits under bink: hits by a weapon with bink (Barrett) fired within BinkTicks after the shooter was
;    hit while holding it - the game spreads those bullets widely, a no-bink cheat does not;
;  - hits while moving: hits by a weapon with movement inaccuracy (Barrett, Ruger) fired while running,
;    jumping or flying;
;  - head: the share of head hits (from the damage of a bullet and its speed).
; Only hits are seen: the server tells the script nothing about bullets that miss. The weapons are read
; every WeaponCheckTicks. Every finding goes to data/<LogFile> (empty = none) with the ping, computer id
; and address; admins in the game are told when the player's suspicion reaches TellFromScore %
; (TellAdmins = 1), at most once every TellEverySeconds.
Enabled = 1
SuspectsCommands = suspects
StatsCommands = acstats
ClearCommands = acclear
TellAdmins = 1
TellFromScore = 50
TellEverySeconds = 60
LogFile = anticheat.log
WeaponCheckTicks = 30
PositionTicks = 10
StartUpSlack = 7
FireIntervalShare = 0.85
JumpPixels = 40
JumpLagTicks = 10
MovedGraceTicks = 90
BinkTicks = 35

[MapGeometry]
; basicext_dll reads the walls of the map (MapFolder + map name + .pms, from the server folder) at every
; map change and casts the rays itself: the radar's view (seen), the trajectory, the aimbot, the
; realistic fog of war of the damage numbers. A ray costs the library about a microsecond, a script
; call to Map.RayCast much more, so the view is made with VisionRaysPerTick rays a tick (1-2000;
; [Radar] VisionRaysPerTick is used when the map cannot be read). /be_status shows whether the map was
; read and compares some rays with the server's own.
Enabled = 1
MapFolder = maps/
VisionRaysPerTick = 120

[MapsList]
; The maps list file of the server (from the server folder); it is shuffled when the script starts
; and by /randomize, and read again by /reloadsettings
File = mapslist.txt
ShuffleOnStart = 1

[Debug]
; 1 = bots get the health display, damage numbers and the radar too, and the lines to everybody are
; also written to the server console. The server sends no texts to bots, so this only runs that
; code on a test server without players (see /be_status).
BotsSeeTexts = 0
