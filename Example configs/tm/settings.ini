TextsPerUpdate = 20
MovePixels = 2
LayerFirst = 100
Scale = 0.08
CursorScale = 0.1
Color = $FF3030
HitColor = $33CC00
CursorColor = $DCB201
ViewOnly = 1
ViewMargin = 25
FollowBullet = 1
FollowUpdateTicks = 2
CursorUpdateTicks = 2
