; ============================================================================
;  Basic-Extended 3.5 settings
;  Example: tm - Team Match: a team radar without flags, medic, assists, savior; the "hack" tools
;  only for admins.
;
;  Lines starting with ; are comments. Switches accept 1/0, true/false, yes/no, on/off.
;  Colours are $RRGGBB. Times are in seconds unless the key name says Ticks (60 ticks = 1 second).
;  Numbers may use a dot or a comma.
;  Commands = words separated by |, written without the ! or / and matched in lower case; an empty
;  list switches that command off. Files are read from the data folder of this script.
;  /reloadsettings (admin in game, or the server console) applies changes while the server runs.
;  Unknown keys and values out of range are reported in the server console at load.
; ============================================================================

[General]
; Console lines sent to one player per tick (1-10); the rest waits for the next ticks. Many lines to one
; player in one tick can stop the server, so keep this low.
LinesPerTick = 4
; Lines sent to everybody per tick (1-5)
BroadcastLinesPerTick = 2
; Longest waiting queue per player (lines, 20-1000); anything beyond is dropped
MaxQueuedLines = 200
; Default colours of answers
ColorGood = $00BFFF
ColorBad = $FF0033
; Told to everybody when the script starts (after /recompile); {version}; empty = nothing
StartMessage = Basic-Extended v{version} loaded - successfully :)

; ----------------------------------------------------------------------------------------------------
;  Combat: health display, regeneration, kits, damage numbers, hit markers, radar
; ----------------------------------------------------------------------------------------------------

[HealthHud]
; Health of the player on their screen (BigText). It is sent only when the shown value changes (a hit,
; regeneration, respawn), with a very long display time, and hidden with ' ' when the player dies or
; goes to the spectators. Players change it with !hp (see Commands).
Enabled = 1
; BigText layer (0-255). ZitroStats uses 12-15, Soldat's own kill messages use 1.
Layer = 199
; Shown to players who have not switched it off themselves
DefaultOn = 1
; Default position (0-854 x 0-480: 480 is the screen height, the width depends on the aspect ratio of
; the player's screen - keep X below 600 to be seen on every screen) and letter size (0.005-0.5).
; ZitroStats' own line (!hud) is at 20 436 and its admin countdown at 20 410, both size 0.02.
X = 20
Y = 384
Scale = 0.02
; Styles a player chooses with !hp style <n>. Tokens: {pct} percent, {hp} health points,
; {max} maximum health, {bar} bar, {regen} RegenMark while regenerating, {vest} vest percent
Style1 = Health: {pct}% {regen}
Style2 = HP {hp}/{max} {regen}
Style3 = {bar} {pct}% {regen}
Style4 = {pct}% {regen}
Style5 = Health: {pct}% Vest: {vest}% {regen}
DefaultStyle = 1
BarLength = 10
BarFull = |
BarEmpty = .
RegenMark = +
; Colour from full health through half to no health (a smooth blend)
ColorFull = $00FF00
ColorHalf = $FFFF00
ColorLow = $FF0000
; Display time of one message (ticks, 600-3600000; 360000 = 100 minutes). The text is sent when it
; changes, after a respawn and a map change, and again every RefreshSeconds (0-3600, 0 = never): the
; 2.8.2 server sends such texts without any delivery check, so a lost one is repaired that way.
DisplayTicks = 360000
RefreshSeconds = 5
; Commands of the players (!hp, !hp on|off|style <n>|size <n>|pos <x> <y>|edit|done|reset|help)
Commands = hp|health
; Remember each player's choice (data/players.txt, by Steam id; a player without Steam by their
; computer id - HWID)
SavePlayers = 1
; The editor (!hp edit, !radar edit): the player stands still and moves the text with the movement
; keys, jump / crouch = up / down, reload / change weapon = bigger / smaller; the grenade key (E) or
; !hp done = save and leave, lying down (X, prone) = leave without saving. It saves and ends by itself
; after EditorSeconds (5-600) or when the player is hit. A tap moves the text by EditorStep pixels
; (1-20); a held key waits a third of a second, then moves slowly, and faster after a second.
EditorSeconds = 60
EditorStep = 1
; Low health: at LowPercent (0 = off) and below the text is LowColor, blinking with LowBlinkColor
; every LowBlinkTicks ticks (0 = no blinking)
LowPercent = 25
LowColor = $FF0000
LowBlinkColor = $FFFFFF
LowBlinkTicks = 20

[Regeneration]
; Battlefield 3 style: after DelaySeconds without being hit (and without enemy bullets flying close,
; see [Suppression]) health comes back, slowly at first and faster and faster, up to MaxPercent.
; Rates are percent of the maximum health (150, or 65 in realistic mode) per second.
Enabled = 1
DelaySeconds = 5
StartRate = 3
; added to the rate every second while regenerating
Acceleration = 12
MaxRate = 50
; up to this percent of the maximum health (1-100)
MaxPercent = 100
; Health is added every StepTicks ticks (1-30)
StepTicks = 6
; Bots regenerate as well
Bots = 1
; set = health is set directly (no damage event); damage = healed through Soldat's damage routine with a
; negative value, so other scripts (ZitroStats healing statistics) see it like a healing field. A vest
; would keep three quarters of such a heal, so players with a vest are always healed directly.
Method = set

[Suppression]
; An enemy bullet flying within Radius pixels of a player (ExplosiveRadius for grenades, M79, LAW,
; clusters and flame arrows) delays their regeneration by DelaySeconds, even when it misses. A player
; is about 25 pixels tall. Bullets are checked every ScanTicks ticks (1-30), and only while somebody
; waits for regeneration.
Enabled = 1
Radius = 50
ExplosiveRadius = 130
DelaySeconds = 3
ScanTicks = 4
; Bullets of team mates count too when friendly fire is on
TeamBullets = 1

[Kits]
; Kits removed from the maps: their spawn points are switched off while a map loads (no kit is created),
; the kits of a running map are removed, and a kit that appears anyway is removed within SweepSeconds
; (1-30). A kind switched back on with /reloadsettings comes back from the next map.
; Medical kits (the regeneration replaces them)
Medkits = 1
; Grenade kits (1 = players have only the grenades they spawn with; on for the RSCS mode)
GrenadeKits = 1
; Bonus kits: flamer, predator, vest, berserker and cluster grenades
BonusKits = 0
SweepSeconds = 3

[DamageNumbers]
; Numbers above the hit player, seen only by the shooter (WorldText). Hits in the same tick are added up
; and sent as one message; at most 8 numbers and radar texts go to one player in one tick.
Enabled = 1
DefaultOn = 1
; Commands of the players (!dmg switches the numbers on and off)
Commands = dmg|damage
; sum = one number per victim that grows while the hits keep coming (StackTicks apart at most);
; column = every hit on its own line under the previous ones (5 lines at most); hit = every hit gets
; its own number
Mode = sum
; percent = percent of the victim's maximum health, hp = health points
Unit = percent
; taken = the health the victim really lost: after the other scripts (spawn protection may cancel a
; hit), after the vest, and never more than they had - a hit that did nothing shows nothing;
; hit = the damage the hit carried, as Soldat gave it to this script (can be over 100%)
Amount = taken
; Realistic mode hides the players a shooter cannot see (behind a wall, behind their back, over 1000
; pixels away). A number over such a player would show where they are, so none is shown (nor a kill mark).
; auto = only in realistic mode, on = in every mode, off = never
LineOfSight = auto
; Show the damage a player does to themselves (own grenades)
ShowSelf = 1
; 1 = a number keeps its full colour for DisplayTicks and is taken away at once; 0 = it fades out
; (the game fades a text over its last 77 ticks, so short-lived texts look pale)
Sharp = 1
StackTicks = 45
DisplayTicks = 90
Scale = 0.0235
; Where the number is: centred over the player, OffsetX pixels to the right (negative = left) and
; OffsetY pixels above the victim's feet to the top of the text (the head is about 20 above them)
OffsetX = 0
OffsetY = 26
; WorldText layers used for one shooter (1-255). Respawns-Control uses the spawn point numbers
; (only for admins who show the spawn points).
LayerFirst = 200
LayerLast = 209
ColorEnemy = $FF6060
ColorFriend = $60FF60
ColorSelf = $FFFF60
ColorKill = $FF2020
; Text of a kill (added to the number)
KillMark = X

[HitFlash]
; A red flash over the whole screen of the hit player (a giant letter O whose ring lies over the
; edges of the screen, like battlefield.pas). It lasts TicksPerPercent ticks per percent of health
; lost (MinTicks-MaxTicks) and fades out. The client puts BigText in a 480 units high space whose width
; depends on the player's screen (640 at 4:3, 854 at 16:9), so one edge of the screen alone cannot be
; flashed reliably - the direction comes from [HitMarker].
Enabled = 0
Char = O
Scale = 75
X = -4100
Y = -4100
Color = $FF0000
Layer = 197
TicksPerPercent = 0.7
MinTicks = 10
MaxTicks = 70

[Radar]
; The players near you with their health: a list, a circle, labels over the players, or dots on a
; ring around your soldier. It shows players behind walls, so who gets which mode is set below.
; Two groups:
;  - full users: the Steam ids of SteamIds (S123456789, 76561198083722517, STEAM_0:1:61728394 or
;    [U:1:123456789]; several separated by |), and the admins in the game with AdminsFull = 1;
;  - everybody else, only with Public = 1.
; Each group has its modes (FullModes / PublicModes: list|circle|labels|ring, all or none), the mode
; it starts with (Mode / PublicMode), whether the radar is on at the start (DefaultOn /
; PublicDefaultOn), what it shows (Show / PublicShow) and how often it may be updated (FullMinTicks /
; PublicMinTicks). Example: a circle for everybody with only the enemies the team can see, and every
; mode with everybody for the admins:
;   Public = 1, PublicModes = circle, PublicShow = seen, AdminsFull = 1, FullModes = all, Show = all
Enabled = 1
SteamIds = S1885850061
AdminsFull = 1
Public = 1
FullModes = list|circle|labels|ring
PublicModes = circle|list
DefaultOn = 1
PublicDefaultOn = 0
; Commands: /radar (/overlay) for full users and admins, !radar in the chat. Both take: on, off,
; mode <name> (or just the name), tick <n>, zoom <n>, show <filter>, team on|off, outline on|off,
; edit, done, pos <x> <y>, size <n>, marks <n>, edge <n>, reset, help. The help lists only the modes
; the player may use. The place, the size, the zoom and the update rate are kept for each mode:
; size is the list's letters, the circle, the labels' letters or the ring's dots; edit moves and
; resizes the list and the circle, and resizes the labels and the ring.
Commands = overlay|radar
PlayerCommands = radar
; The mode a group starts with (list, circle, labels or ring); every player may choose another one of
; the group's modes with !radar mode
Mode = labels
PublicMode = circle
; Players within Range pixels (50-5000; a screen is about 850 wide). ListRange, LabelsRange,
; CircleRange and RingRange (0 = Range) give a mode its own reach.
Range = 700
ListRange = 0
LabelsRange = 0
CircleRange = 0
RingRange = 0
; No faster than every FullMinTicks / PublicMinTicks ticks (1-600), also with !radar tick
FullMinTicks = 1
PublicMinTicks = 10
; -- list --
; Top-left corner (0-854 x 0-480), letter size and colour, BigText layer of the title (0-255)
ListX = 10
ListY = 150
ListScale = 0.018
ListColor = $E0E0E0
ListLayer = 198
; The nearest ListLines players (1-20), made again every ListUpdateTicks ticks (1-600; each player may
; choose their own with !radar tick <n>); a text is sent only when it changes
ListLines = 8
ListUpdateTicks = 15
; First line (empty = none) and one line per player. Tokens: {name} {pct} health percent,
; {m} the distance in meters as the kill screen shows it (pixels / 14), {dist} the distance in pixels,
; {dir} where the player is (< left, > right, ^ above, v below, o here), {tag} F or R (see Tags)
ListTitle = Radar
ListLine = {dir} {tag}{name} {pct}% {m}
; Decimals of {m} (0-3; the kill screen shows 2)
ListMeterDecimals = 2
; The line when nobody is within reach ({m} = the reach in meters, {range} = in pixels)
ListNobody = (nobody within {m})
; The colour of a player's line: team (FriendColor / EnemyColor), health, distance (RingColorNear -
; Mid - Far) or none (ListColor; then the whole list is one text). With a colour every line is its own
; BigText on the layers ListLineLayerFirst .. +ListLines+2 (keep them clear of 197-199), ListLineSpacing
; lines apart (0.6-4).
ListColorBy = team
ListLineSpacing = 1.2
ListLineLayerFirst = 170
; -- circle --
; Top-left corner of the circle (0-854 x 0-480), its radius (10-240) and the size of its marks; the
; radius stands for the reach. CircleDots (0-32) dots draw the ring, SelfChar is you in the middle;
; the players within reach are EnemyChar / FriendChar (team mates in team games), those further away
; sit on the ring as FarChar in their direction (ShowFar = 1). Made again every CircleUpdateTicks
; ticks; a player's mark is sent again only when it moved more than CircleMovePixels screen pixels
; (0-20; 0 = every pixel, the smoothest). A bigger circle (!radar size) moves its marks in finer steps;
; !radar marks <n> keeps the marks small in it. CircleEdgeScale (0.2-5; !radar edge <n> for each
; player) sizes the dots on the edge: the ring and the players beyond reach.
; BigText layers CircleLayerFirst .. CircleLayerFirst+67.
CircleX = 10
CircleY = 110
CircleRadius = 50
CircleScale = 0.03
CircleUpdateTicks = 4
CircleDots = 16
CircleLayerFirst = 110
ShowFar = 1
CircleMovePixels = 0
CircleEdgeScale = 1
RingChar = .
RingColor = $808080
SelfChar = +
SelfColor = $FFFFFF
EnemyChar = o
EnemyColor = $FF4040
FriendChar = o
FriendColor = $40FF40
FarChar = .
; The walls around you in the circle: OutlineDots (4-64) rays go out from you in every direction and a
; dot shows where each one meets a wall (within the reach) - the shape of the room or cave you are in.
; Made again only when you moved OutlineGridPixels or the circle changed. Outline = 0 switches it off
; for everybody; each player switches it with !radar outline on|off (OutlineDefaultOn = the start).
; BigText layers OutlineLayerFirst .. +OutlineDots-1.
Outline = 1
OutlineDefaultOn = 0
OutlineDots = 32
OutlineLayerFirst = 40
OutlineColor = $707070
OutlineChar = .
OutlineGridPixels = 24
OutlineMovePixels = 2
; Team mates are shown in team games with ShowTeam = 1 (each player may choose with !radar team on|off).
ShowTeam = 1
; Which enemies it shows (team mates always):
;   all         - everybody;
;   seen        - those you or a living team mate can see: on a realistic server by the game's rule
;                 (in front of the aim, no wall between, up to 1000 px), on a normal server those on
;                 the screen of you or the mate (walls do not hide anybody there);
;   seenall     - like seen, dead team mates count too;
;   seenreal    - like seen, but always by the realistic rule (walls hide) on any server;
;   seenallreal - like seenreal with the dead team mates.
; Show for full users (they may choose anything), PublicShow for everybody else (they may not choose
; to see more). The realistic rule casts rays: the team's view is made again every VisionRoundTicks
; ticks (1-600) with at most VisionRaysPerTick ray casts a tick (1-200).
Show = all
PublicShow = seen
VisionRaysPerTick = 24
VisionRoundTicks = 15
; A bigger radar (size, !radar size) reaches a little further: SizeAffectsRange of the size change
; (0-1; 0.25 = size 2 reaches 25% further). !radar zoom <n> multiplies the reach; the circle marks get
; smaller for it (by the square root of the zoom).
SizeAffectsRange = 0.25
; Tags = 1: a flag carrier is FlagChar, a player with a bow BowChar (on the circle, in the list as
; the token {tag}, in the labels in brackets, on the ring)
Tags = 1
FlagChar = F
BowChar = R
; Flags = 1: a flag that is out of its base and not carried (dropped) is shown in every mode (a carried
; flag is the carrier's own letter, never a second mark) - a line
; of the list (ListFlagLine with {flag} {dir} {m} {dist}), FlagMarkChar on the circle and the ring, its
; name over it in the labels. Flags in their base are not shown. CTF and Infiltration: red and blue,
; Hold the Flag and Pointmatch: the yellow one.
Flags = 0
FlagMarkChar = F
FlagRedName = Red flag
FlagBlueName = Blue flag
FlagYellowName = Flag
FlagRedColor = $FF4040
FlagBlueColor = $4080FF
FlagYellowColor = $FFFF40
ListFlagLine = {dir} {flag} {m}
; Everything is worked out in basicext_dll, and a text is sent only when it changed. At most
; TextsPerTick radar texts go to one player in a tick (1-40) and MaxTextsPerSecond (10-2000) in a
; second; what does not fit follows in the next ticks.
TextsPerTick = 20
MaxTextsPerSecond = 150
; -- ring (the mode name "arrows" still works) --
; One dot on a ring RingRadius pixels around your soldier for each of the RingPlayers (1-32) nearest
; players within reach, in their direction. The size of the dot tells the distance: RingDotNear for
; the nearest, down to RingDotFar at the edge of the reach, in RingSizeSteps sizes (1-16). The colour
; (RingColorBy): team = EnemyColor / FriendColor of the circle, distance = RingColorNear - Mid - Far,
; health = the colour of the player's health. A flag carrier, a bow or a dropped flag is a letter of
; RingLetterScale, up to RingTagScale bigger when near. The ring is drawn where your soldier will be when it reaches you (your ping times
; RingLead, 0-3), and a dot goes out again only when it moved more than RingMove pixels. Made again
; every RingUpdateTicks ticks (!radar tick <n> in the ring mode). WorldText layers RingLayerFirst ..
; +34 (one per player slot and the flags).
RingUpdateTicks = 5
RingPlayers = 6
RingRadius = 30
RingDotNear = 0.16
RingDotFar = 0.07
RingSizeSteps = 4
RingColorBy = team
RingColorNear = $FF2020
RingColorMid = $FFFF20
RingColorFar = $20FF20
RingDotChar = .
RingTagScale = 0.5
RingLetterScale = 0.03
RingMove = 1.5
RingLead = 1
RingLayerFirst = 210
; -- labels --
; "name health%" centred over every player, made again every UpdateTicks ticks (1-600); a label goes
; out again only when its player moved more than LabelMovePixels or the health changed, and is taken
; away when the player dies or leaves the range (no fading). LabelColorBy: health, team, distance or
; none (the health colours).
UpdateTicks = 6
Scale = 0.02
; pixels from the player's feet up to the top of the label (the head is about 20 above them)
OffsetY = 25
LabelMovePixels = 2
LabelColorBy = health
; WorldText layers LayerFirst .. LayerFirst+34 (one per player slot and the flags, 0-220)
LayerFirst = 150

[TeamGuard]
; A player in a team the game mode does not have (a cheat or a console trick) is put into one it has:
; deathmatch, pointmatch and rambomatch - no team (0); CTF, infiltration and HTF - Alpha or Bravo (the
; smaller); teammatch - the four teams. Spectators are left alone.
Enabled = 1

[KillInfo]
; One line to the killed player: who killed them, the killer's health left and the damage they did to
; the killer during their own life, counted from the killer's last respawn or the start of the killer's last
; regeneration (the health really lost, at most 100%). Tokens: {killer} {weapon} {pct} {hp} {dealt}
Enabled = 1
Text = Killed by {killer} ({weapon}), {pct}% health left. You hit them for {dealt}.
Color = $FFA500

