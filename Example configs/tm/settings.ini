[Teleport]
; Three ways for an admin to move to the cursor with Key (reload, grenade, throw or changeweapon; the
; key keeps doing its own job too), each switched on and off by its command (and off at every join).
; The key is read every tick; the game sends it with the player's movement packets.
;   /tele         a press: jump there and stop
;   /teletomouse  a tap: jump there and keep flying that way (the speed you had * MomentumKeep, plus
;                 MomentumBase, plus MomentumPerPixel for every pixel of the jump, at most MomentumMax).
;                 Held for HoldTicks ticks or longer: you fly where the cursor points - move the mouse
;                 to the other side and you turn round (HoldSteer, 0.01-1, is how much of a turn is taken
;                 each tick) - with a jump towards the cursor at most every HopTicks ticks (and not
;                 before your ping has passed) when it is HopMinPixels or more away (HopMaxPixels at
;                 most), and a push every PushTicks ticks in between. After a jump the game's camera
;                 lags behind for a moment, so the cursor seems to be behind you: that is left out.
;                 /teletomouse inherit: the longer you hold, the faster you fly - InheritAccel pixels a
;                 tick more every second and InheritGain more for every jump, at most InheritMax.
;                 /teletomouse fixed: the speed by the distance to the cursor.
;                 HoldSpeed is the variant a plain /teletomouse starts with.
;   /flytomouse   while the key is held, every FlyEveryTicks a push towards the cursor of FlyBase +
;                 FlyPerPixel per pixel beyond FlyDeadZone, at most FlyMax; with the cursor within
;                 FlyDeadZone pixels of the soldier you hover. FlySmooth (0.05-1) is how much of a change
;                 of the direction is taken at once (less = steadier). The game itself (the server and
;                 every player's game) never lets a soldier move faster than 11 pixels a tick on each
;                 axis - 15.5 diagonally - so that is as fast as a push can make it (FlyVelocityMax,
;                 1-15.5). FlyHops = 1 goes further: what FlyMax (up to 60) asks above that is made up
;                 with short jumps along the way, every FlyHopTicks ticks at most (1-60, not before
;                 your ping has passed), each at most FlyHopMaxPixels long; faster, but it looks like
;                 small teleports.
; Speeds are pixels a tick; the game allows 11 on each axis (15.5 diagonally). Not into a wall with
; NotIntoWalls = 1 (checked by basicext_dll when [MapGeometry] read the map).
Enabled = 1
Commands = tele|tp
MomentumCommands = teletomouse|ttm
FlyCommands = flytomouse|ftm
Key = reload
NotIntoWalls = 1
MomentumBase = 2
MomentumPerPixel = 0.008
MomentumKeep = 1
MomentumMax = 11
HoldTicks = 15
HoldSteer = 0.3
HopTicks = 6
HopMinPixels = 24
HopMaxPixels = 600
PushTicks = 3
HoldSpeed = inherit
InheritAccel = 4
InheritGain = 0.6
InheritMax = 11
FlyBase = 1.5
FlyPerPixel = 0.04
FlyMax = 15.5
FlyVelocityMax = 15.5
FlyHops = 0
FlyHopTicks = 4
FlyHopMaxPixels = 160
FlyEveryTicks = 2
FlyDeadZone = 8
FlySmooth = 0.5

[Trajectory]
; /trajectory - where the bullets of your weapon fly, as dots from the gun (green = where they hit a
; wall); /trajectory <player> - the flight of that player's bullets (with the cursor); again or
; /trajectory off stops it. Worked out in basicext_dll from the weapons of the server (see [Weapons]): speed, gravity,
; the speed of the soldier the bullet takes along, the gun's place for standing, crouching and prone.
; Drawn every UpdateTicks ticks (1-60) up to Range pixels, Dots dots at most (2-60) out of points
; Spacing pixels apart. The path is worked out again only when the position, speed, cursor, weapon or
; stance changed. The dots go out together (at most TextsPerUpdate texts at a time, 1-64; keep it
; above Dots), and only when the path moved more than MovePixels. WorldText layers LayerFirst ..
; LayerFirst+Dots.
; ViewOnly = 1: the dots cover only the part of the path the watcher can see: the screen around the
; camera, which the game keeps between the soldier and the cursor (a Barrett zoom or a bullet the
; camera follows moves it further out), with ViewMargin pixels more on each side. Without
; [MapGeometry] the walls come from the script (slower).
; Soldat sends the cursor to the server only now and then (after the mouse moved 30 pixels or more),
; so the path shows where the server thinks you aim: an M79 or a far shot can land a little off.
; FollowBullet = 1: when the watched player fires a Barrett while crouching or prone (the game's
; camera then follows the bullet), the dots are drawn ahead of the flying bullet itself, every
; FollowUpdateTicks ticks (1-60), and the ones it passed go away.
; /trajectory <player> cursor - only that player's cursor, every CursorUpdateTicks ticks (1-60).
; Who sees it: /trajectory <player> [cursor] [me|self|selfme|public]
;   me (the default) - only the admin who asked, never the watched player;
;   self   - only the watched player (his own dots, without the cursor mark);
;   selfme - the watched player and the admin;
;   public - everybody in the game.
; Colliders = 1: the red circles of the map that stop bullets end the path too.
