[Classes]
; Battlefield classes (the owner's Battlefield mod rebuilt): every soldier of a team plays a class - the weapons of
; his menu, what he carries at the respawn (Loadout), perks that work by themselves and two skills (!skill,
; !skill2; bind a key to them: bind "c" "/skill"). Modes: the game modes it works in (not with the Advance mode,
; which gives the weapons itself).
; Assign = choice: a player picks his class with !class <name or number> - it comes with his next respawn, at once
; within ChangeSeconds of a respawn while he has used nothing yet (no skill, no shot); who picked nothing gets one
; rolled. limited: the same choice, but a class his team has LimitedSpread players more of than the class it has
; fewest of (that he may play) is refused - so a team never plays one class only. life: a new class rolled at
; every death. round: one rolled for every survival round (a survivor whose kit [Ammo] SurvivalCarry keeps keeps
; his class; in the other modes: at the join and at every map's start). map: one rolled for the whole map, kept by
