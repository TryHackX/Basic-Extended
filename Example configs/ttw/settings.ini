; his last three, letter case, spaces and repeated letters left out), LongWeight over LongLength letters,
; CapsWeight with CapsPercent capitals, OneCharWeight for "aaaaaaaa"; the points melt by DecayPerSecond.
; Normal talk - different lines at a talking pace - stays near 0; the same line three times in a row
; quickly, or five times at a few seconds' pace, is a mute. WarnAt: a warning (WarnText); MuteAt:
; muted for MuteSeconds, every next mute within MemoryMinutes twice as long (at most MaxMuteSeconds).
; The mute is the server's own (by the IP: his lines go to nobody, he cannot call a vote); the script lifts
; it when its time is over - also after he left and came back (the server mutes an IP again at the join
; by itself; the script's file of mutes, File in the data folder, knows the end time). A mute nobody of
; this script made (the server's /gmute) is left alone. The server bans a player for 5 minutes by itself
; after about 6 lines in a few seconds ("Chat Flood"), and for a line over 100 letters - the script is
; meant to speak up before that. Admins: /tmute <player> [time: 30s, 10m, 2h, 1d] [reason] (AdminMuteMinutes
; without a time), /tunmute <player>, /mutelist (/mute and /unmute are the game's own commands on the
