[Teleport]
; Three ways for an admin to move to the cursor with Key (reload, grenade, throw or changeweapon; the
; key keeps doing its own job too), each switched on and off by its command (and off at every join).
; The key is read every tick; the game sends it with the player's movement packets.
;   /tele         a press: jump there and stop
;   /teletomouse  a tap: jump there and keep flying that way (the speed you had * MomentumKeep, plus
;                 MomentumBase, plus MomentumPerPixel for every pixel of the jump, at most MomentumMax).
;                 Held for HoldTicks ticks or longer: you fly where the cursor points - move the mouse
;                 to the other side and you turn round (HoldSteer, 0.01-1, is how much of a turn is taken
;                 each tick) - with a jump towards the cursor at most every HopTicks ticks (and not
;                 before your ping has passed) when it is HopMinPixels or more away (HopMaxPixels at
;                 most), and a push every PushTicks ticks in between. After a jump the game's camera
;                 lags behind for a moment, so the cursor seems to be behind you: that is left out.
;                 /teletomouse inherit: the longer you hold, the faster you fly - InheritAccel pixels a
;                 tick more every second and InheritGain more for every jump, at most InheritMax.
;                 /teletomouse fixed: the speed by the distance to the cursor.
;                 HoldSpeed is the variant a plain /teletomouse starts with (after a /reloadsettings
;                 for those who join).
;   /flytomouse   while the key is held, every FlyEveryTicks a push towards the cursor of FlyBase +
;                 FlyPerPixel per pixel beyond FlyDeadZone, at most FlyMax; with the cursor within
;                 FlyDeadZone pixels of the soldier you hover. FlySmooth (0.05-1) is how much of a change
;                 of the direction is taken at once (less = steadier). The game itself (the server and
;                 every player's game) never lets a soldier move faster than 11 pixels a tick on each
;                 axis - 15.5 diagonally - so that is as fast as a push can make it (FlyVelocityMax,
;                 1-15.5). FlyHops = 1 goes further: what FlyMax (up to 60) asks above that is made up
;                 with short jumps along the way, every FlyHopTicks ticks at most (1-60, not before
;                 your ping has passed), each at most FlyHopMaxPixels long; faster, but it looks like
;                 small teleports.
; Speeds are pixels a tick; the game allows 11 on each axis (15.5 diagonally). Not into a wall with
; NotIntoWalls = 1 (checked by basicext_dll when [MapGeometry] read the map).
Enabled = 1
Commands = tele|tp
MomentumCommands = teletomouse|ttm
FlyCommands = flytomouse|ftm
Key = reload
NotIntoWalls = 1
MomentumBase = 2
MomentumPerPixel = 0.008
MomentumKeep = 1
MomentumMax = 11
HoldTicks = 15
HoldSteer = 0.3
HopTicks = 6
HopMinPixels = 24
HopMaxPixels = 600
PushTicks = 3
HoldSpeed = inherit
InheritAccel = 4
InheritGain = 0.6
InheritMax = 11
FlyBase = 1.5
FlyPerPixel = 0.04
FlyMax = 15.5
FlyVelocityMax = 15.5
FlyHops = 0
FlyHopTicks = 4
FlyHopMaxPixels = 160
FlyEveryTicks = 2
FlyDeadZone = 8
FlySmooth = 0.5

[Trajectory]
; /trajectory - where the bullets of your weapon fly, as dots from the gun (green = where they hit a
; wall); /trajectory <player> - the flight of that player's bullets (with the cursor); again or
; /trajectory off stops it. Worked out in basicext_dll from the weapons of the server (see [Weapons]): speed, gravity,
; the speed of the soldier the bullet takes along, the gun's place for standing, crouching and prone.
; Drawn every UpdateTicks ticks (1-60) up to Range pixels, Dots dots at most (2-60) out of points
; Spacing pixels apart. The path is worked out again only when the position, speed, cursor, weapon or
; stance changed. The dots go out together (at most TextsPerUpdate texts at a time, 1-64; keep it
; above Dots), and only when the path moved more than MovePixels. WorldText layers LayerFirst ..
; LayerFirst+Dots.
; ViewOnly = 1: the dots cover only the part of the path the watcher can see: the screen around the
; camera, which the game keeps between the soldier and the cursor (a Barrett zoom or a bullet the
; camera follows moves it further out), with ViewMargin pixels more on each side. Without
; [MapGeometry] the walls come from the script (slower).
; Soldat sends the cursor to the server only now and then (after the mouse moved 30 pixels or more),
; so the path shows where the server thinks you aim: an M79 or a far shot can land a little off.
; FollowBullet = 1: when the watched player fires a Barrett while crouching or prone (the game's
; camera then follows the bullet), the dots are drawn ahead of the flying bullet itself, every
; FollowUpdateTicks ticks (1-60), and the ones it passed go away.
; /trajectory <player> cursor - only that player's cursor, every CursorUpdateTicks ticks (1-60).
; Who sees it: /trajectory <player> [cursor] [me|self|selfme|public]
;   me (the default) - only the admin who asked, never the watched player;
;   self   - only the watched player (his own dots, without the cursor mark);
;   selfme - the watched player and the admin;
;   public - everybody in the game.
; Colliders = 1: the red circles of the map that stop bullets end the path too.
Enabled = 1
Commands = trajectory|traj
UpdateTicks = 5
Dots = 16
Spacing = 16
Range = 2500
TextsPerUpdate = 20
MovePixels = 2
LayerFirst = 100
Scale = 0.08
CursorScale = 0.1
Color = $FF3030
HitColor = $33CC00
CursorColor = $DCB201
ViewOnly = 1
ViewMargin = 25
FollowBullet = 1
FollowUpdateTicks = 2
CursorUpdateTicks = 2
Colliders = 1

[Aimbot]
; /aimbot (or /aim) for admins: while Key (crouch, jet, prone, fire or flagthrow) is held - FlagKey
; while the player carries a flag (the flag key would throw it) - new bullets of the weapon in hand
; fly at an enemy. Target (each admin may change it):
;   cursor  - the enemy nearest to the line of the cursor, within MaxAngle degrees of it;
;   radius  - only enemies within CursorRadius pixels of the cursor, the nearest to it first; with
;             nobody in the circle it does not fire (it never jumps to somebody far away);
;   nearest - the nearest enemy.
; The shot leads a moving target (worked out in basicext_dll with the bullet's speed and gravity) and
; goes only when no wall is in the way (Colliders = 1: the red circles that stop bullets and set off
; grenades count as walls), up to Range pixels, at the fire rate and start-up time of the weapon.
; Every shot takes a round of the weapon's own magazine and the game reloads it (InfiniteAmmo = 1 or
; /infammo: no); a thrown knife leaves the hand like in the game (with infinite ammo it stays).
; While you fire yourself (Key other than fire) it waits and goes on PauseAfterOwnShotTicks ticks after
; you let go (0-600), so the ammo count of the server and of your game stays the same.
; Spread (0-100) is the share of the weapon's own inaccuracy, as the game works it out (standing,
; crouching, prone, running, jumping); 0 = every shot exact.
; ExtraShots: after a kill it fires a random number of shots in this range more (for example 1-5, a
; single number, or off), so it does not stop at once - not while another enemy is within Range, not
; into a wall, and not for a target that is only out of sight; only weapons with a magazine that fire
; at least every ExtraShotsMaxInterval ticks (1-1000). A Minigun or Barrett winds up (with its sound)
; only when there is somebody to shoot at.
; Law: when a LAW may fire - game (on the ground, crouching or prone, as in the game), ground (on the
; ground in any stance) or anywhere (also standing up and in the air).
; With Key = fire the weapon fires too, but its own bullets do no damage while the aimbot is on.
; Sound = 1: the shot is heard up to SoundRange pixels.
; Recoil = 1: a Spas-12 or Minigun shot pushes the shooter back like in the game (the Minigun less
; while jetting, more with the flag).
; /aimbot on|off|cursor|nearest|radius [px]|acc <0-100>|extra <min-max>|law <rule>|colliders on|off
; /aimbot radius edit: a circle of RadiusDots dots around your cursor (only you see it; WorldText layers
; RadiusLayerFirst ..) shows the radius; hold Reload = bigger, Change weapon = smaller, or
; /aimbot radius <px>; /aimbot radius save keeps it (cancel does not; after RadiusEditSeconds it is kept).
; Target, CursorRadius, Spread, ExtraShots, Law and Colliders are where each admin starts: after a
; /reloadsettings they reach those who join (or reset them with /aimbot); Enabled = 0 stops it for all.
Enabled = 1
Commands = aimbot|aim
Key = crouch
; The key while the player carries a flag
FlagKey = crouch
Target = cursor
MaxAngle = 70
CursorRadius = 150
Range = 900
Spread = 0
ExtraShots = 1-5
ExtraShotsMaxInterval = 25
; The extra shots after a kill:
;   fixed  - at the last aim point
;   spread - each shot off by a random angle that grows with the shots of the burst
;   corpse - at the killed soldier's body, where the game has it
;   both   - at the body, with the growing spread
ExtraShotsMode = both
; How much the spread grows (0-100; 5 = about 1 degree more each shot, 0 = none)
ExtraShotsSpread = 5
; 1 = a small flame at the muzzle with the shots (the game shows none for the aimbot's bullets)
MuzzleFlash = 1
Law = game
Colliders = 1
PauseAfterOwnShotTicks = 20
InfiniteAmmo = 0
Sound = 1
SoundRange = 900
Recoil = 1
RadiusDots = 12
RadiusLayerFirst = 120
RadiusColor = $FF8000
RadiusScale = 0.08
RadiusUpdateTicks = 4
RadiusEditSeconds = 60

[Weapons]
; The weapons file of the server for the trajectory and the aimbot: auto = configs/weapons.ini (or
; weapons.ini), in realistic mode configs/weapons_realistic.ini; files of older servers (speeds * 10)
; are read too. Without a file the weapons of Soldat 1.7.1 are used. When an admin loads another
; mod with the server's /loadwep <name>, the library reads configs/<name>.ini as well.
File = auto
RealisticFile = auto

[AntiCheat]
; Numbers worked out in basicext_dll from what the server sees. By default every player may look
; (so anybody can check whether somebody cheats) and /acclear is for admins; change it in [Permissions].
; /suspects [all] - the players of this game by suspicion (all: also the clean ones), with the
;   suspicion in this game and over all games of that computer;
; /acstats <player> - a table: every check in this game and over all games of that computer (kept
;   in data/players.bdb by the hardware id, so also for players without Steam);
; /acreview <player> - the last things noticed, newest first;
; /acclear <player|all> [all] - forget this game (all: also the history); /acclear all all -
;   everybody and the whole history.
; The lines are coloured: ColorTitle for the headers, ColorClean for nothing found, ColorNotice for a
; little, ColorFound for a lot.
; What is measured:
;  - start-up: a Barrett (or LAW) bullet that comes sooner after the fire key than the weapon's
;    StartUpTime allows, less StartUpSlack ticks (the key reaches the server with the movement packets,
;    up to 4 ticks late; a packet lost on the way can make one honest shot look short, so look at the
;    share: a cheat without start-up is short every time);
;  - fire rate: two bullets of a weapon with a long fire interval (20 ticks or more) closer together
;    than FireIntervalShare of it;
;  - ammo: the magazine emptied faster than the fire interval allows, or filled again sooner than the
;    reload time (read every WeaponCheckTicks; /give, /infammo, the aimbot and picked-up weapons are
;    left out);
;  - teleports: a living player who moved further than the game allows (11 px a tick on each axis)
;    between two looks at the positions (every PositionTicks), with JumpLagTicks of lag and JumpPixels
;    more; moves by this script (teleport, /bring, /goto, freeze, /speed, respawn) are left out for
;    MovedGraceTicks;
;  - speed: more than SpeedPixels a tick on average over a second (running tops at about 4, jets and
;    falls at 11-15);
;  - hits under bink: hits by a weapon with bink (Barrett) fired within BinkTicks after the shooter was
;    hit while holding it - the game spreads those bullets widely, a no-bink cheat does not;
;  - hits while moving: hits by a weapon with movement inaccuracy (Barrett, Ruger) fired while running,
;    jumping or flying.
; Only hits are seen: the server tells the script nothing about bullets that miss. Every finding goes
; to data/<LogFile> (empty = none) with the ping, computer id and address; admins in the game are told
; when the player's suspicion reaches TellFromScore % (TellAdmins = 1), at most once every
; TellEverySeconds.
; VoteKick = 1: a vote to kick the player starts (with the reason, and a line to everybody saying what
; was found) when the suspicion reaches VoteFromScore % with at least VoteMinFindings findings in this
; game - not while another vote runs, not for admins, at most once every VoteEverySeconds per player.
Enabled = 1
SuspectsCommands = suspects
StatsCommands = acstats
ReviewCommands = acreview
ClearCommands = acclear
TellAdmins = 1
TellFromScore = 50
TellEverySeconds = 60
LogFile = anticheat.log
WeaponCheckTicks = 15
PositionTicks = 10
StartUpSlack = 7
FireIntervalShare = 0.85
JumpPixels = 40
JumpLagTicks = 10
MovedGraceTicks = 90
BinkTicks = 35
SpeedPixels = 16.5
VoteKick = 0
VoteFromScore = 70
VoteMinFindings = 3
VoteEverySeconds = 600
ColorTitle = $FFFFFF
ColorClean = $90E090
ColorNotice = $FFD040
ColorFound = $FF5050

[Permissions]
; Who may use a command and how it is typed. <command> = <who> [<how>]:
;   who: all (every player), admins (admins in the game; the server console and TCP admins always
;        may), console (only the server console or a TCP admin) or off (nobody; the words are free);
;   how: / (a command, nobody else sees it), ! (a chat line, everybody sees it) or both.
; Without a line a command stays as the script has it: the player commands for all with !, the
; admin commands for admins with /; suspects, acstats, acreview and the commands of the modules (ammo, mag,
; repack, ammohud, the grenade types, rocket, the team-kill votes, mine, claymore, mines, spot to bounty, pause,
; unpause, shop to sell, class to skill2, score, scores, c4, detonate, insurgents) for all with / and !; pm, r,
; pmmute, pmunmute, note and report for all with / only.
; The words themselves are set in the sections above.
; The names: commands rules maplist ratio ping track time whoisadmin calladmin join spec alpha bravo
; charlie delta hp dmg nextmap lastmap map radar medic info adminradar admincommands ip hwid ban
; banhwid banip killall kickall explodeall randomize reloadsettings status test bench steamadmin tele
; teletomouse flytomouse explode god heal slap freeze bring goto disarm give bonus trajectory aimbot
; bigexplode nuke statgun removestatgun infammo dmgfix dmgtaken vest suspects acstats acclear acreview
; speed sayas sayteam slay ammo mag repack ammohud be_prof grenadetype nade flash flashhelp rocket
; teamkill tkforgive tkpunish tkpoints tknextround tklist tkreset mine claymore mines minelist mineclear
; givemines spot bandage kit giveup bounty pm r pmmute pmunmute note report comments noteban noteunban
; notebanlist col colteam colp announce tmute tunmute mutelist pause unpause unbanlast banlist maplistadd
; maplistremove mapfind mappart warn shop buy money pay sell givemoney takemoney setmoney wallet
; moneyreset shoplist supplydrop class classes skill skill2 setclass score scores bansteam
; unbansteam steambans unbanname lag c4 detonate insurgents givevest takevest
; (map is the players' ?map - the current map; mappart is the admins' /map <part of a name>.)
; Examples:
;   aimbot = admins both      (/aimbot and !aimbot, !aim in the chat)
;   rules = all both          (!rules and /rules)
;   ratio = off
;   trajectory = console
; (adminradar is /radar of [Radar] Commands; the radar keeps its own rules of who may use which mode.)
aimbot = admins /
trajectory = admins /
tele = admins /
teletomouse = admins /
flytomouse = admins /
speed = admins /
sayas = admins /
sayteam = admins /
explode = admins /
bigexplode = admins /
nuke = admins /
explodeall = admins /
god = admins /
statgun = admins /
removestatgun = admins /
infammo = admins /
dmgfix = admins /
dmgtaken = admins /
vest = admins /
give = admins /
bonus = admins /
adminradar = admins /
suspects = all both
acstats = all both
acreview = all both

[MapGeometry]
; basicext_dll reads the walls of the map (MapFolder + map name + .pms, from the server folder) at every
; map change and casts the rays itself: the radar's view (seen), the trajectory, the aimbot, the
; realistic fog of war of the damage numbers. A ray costs the library about a microsecond, a script
; call to Map.RayCast much more, so the view is made with VisionRaysPerTick rays a tick (1-2000;
; [Radar] VisionRaysPerTick is used when the map cannot be read). /be_status shows whether the map was
; read and compares some rays with the server's own.
Enabled = 1
MapFolder = maps/
VisionRaysPerTick = 120

[MapsList]
; The maps list file of the server (from the server folder); it is shuffled when the script starts
; and by /randomize, and read again by /reloadsettings
File = mapslist.txt
ShuffleOnStart = 1

[Debug]
; 1 = bots get the health display, damage numbers and the radar too, and the lines to everybody are
; also written to the server console. The server sends no texts to bots, so this only runs that
; code on a test server without players (see /be_status).
BotsSeeTexts = 0
; 1 = the library hooks the server's CreateBullet and CreateThing: every shot and every weapon a soldier
; drops is known the moment the server makes it (the magazine shown drops with each shot, also with the
; reload key held; a dropped weapon keeps its magazines exactly). 0 = without the hooks the ammunition
; follows only the counts the game reports (a shot fired together with a reload is missed). The state
; is in /be_status (hooks: ...).
ServerHooks = 1
