; ---- the classes ----
; Name, Words (for !class), Color, Modes (where the class is played), Max (players of a team in it: a number or a
; percent of the team, at least 1; 0 = no limit), Info (one line for !class and !classes).
; Primary and Secondary: the weapons of its menu - deagles mp5 ak aug spas ruger m79 barrett minimi minigun;
; socom knife chainsaw law (none named: every weapon; a weapon the server's list switches off stays off).
; Loadout: what it carries at the respawn - grenades N, flashes N, mines N, claymores N, javelins N, vest PERCENT,
; bandage PERCENT ([Bleeding]), kits N (first-aid kits of [Bleeding]), mags N (spare magazines over the fresh set
; of [Ammo]), c4 N (the C4 charges of a life); what it does not name the modules give as always (but LoadoutOnly).
; Perks (by themselves, once a second): heal PERCENT RADIUS (team mates within RADIUS px and himself get PERCENT of
; a full health back, not within 2 s of a hit; [Bleeding]: the blood too), repair VEST RADIUS (a vest a mate wears
; gets VEST more), ammo MAGS SECONDS RADIUS (every SECONDS a spare magazine of the weapon in each mate's hands -
; [Ammo]), revive FACTOR RADIUS ([Downed]: he gets the downed up FACTOR times faster, from RADIUS px), bandage FACTOR
; (his bandaging that much faster), armor FACTOR (the damage he takes), damage WEAPON FACTOR STANCE (the damage of
; his WEAPON times FACTOR in STANCE: any, crouch, prone, low = crouch or prone - note: the hit zones of ZitroStats
; read the damage, so they may count such hits wrong), spot FACTOR (his [Spotting] marks last longer), distance
; FACTOR (his [Points] for distance kills), detector RADIUS (the enemy mines of [Mines] within RADIUS px of him are
; found - he sees their marks, with a beep), crit CHANCE FACTOR (CHANCE % of his hits on enemies do FACTOR times the
; damage), wounds FACTOR (his hits open [Bleeding] wounds FACTOR times as often), leech HP (HP of health back for every
; hit on an enemy), firstaid RADIUS (with no wound of his own to bandage he bandages the wounded mates within
; RADIUS px - [Bleeding] - with his own bandage).
; Skill and Skill2: rally SECONDS COOLDOWN [RADIUS] (every mate who respawns while it lasts comes back next to him -
; where he last stood on the ground when he is in the air -, without spawn protection; several rallies of a team take
; the mates in turn, the one that got a mate longest ago first, and one that cannot take him now is passed by;
; RADIUS: only the mates who died within RADIUS px of him; not while he is down or carries a flag; not in survival),
; healthpack COOLDOWN, grenadekit COOLDOWN (a kit on the ground next to him, KitSeconds), statgun SECONDS COOLDOWN
; (a stationary gun; [Shop] StatgunMax of his at once),
; mortar SHELLS COOLDOWN SPREAD (a warning over his aim, then SHELLS shells fall from the sky within SPREAD px of
; it - a soldier in the air under them is hit too; under a roof they fall from the roof),
; uav SECONDS COOLDOWN (every enemy on his team's radar - [Radar] or [Spotting] marks), supply COOLDOWN WORDS (a
; crate of [Supply] at his aim for his team, holding one of WORDS: ammo grenades flashes mines claymore javelin
; medical vest money weapon; none: [Supply] Contents), patchup PERCENT COOLDOWN (his wounds closed - [Bleeding] -
