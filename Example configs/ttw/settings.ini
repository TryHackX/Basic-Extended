[LagGuard]
; The connections of the players (off by default). Once a second each player's ping is read and his warps are counted
; (his position corrected by more than WarpPixels over what his speed allows: the server put him where his late or
; lost packets said); the last WindowSeconds are kept - the average, the spread (the mean jump between two readings),
; the highest ping and the warps a minute. A second in which the server stood still counts for nobody; moves of the
; script (teleports, a rally) are no warps. It never kicks: the server kicks above soldat.ini Max_Ping after
; Max_Ping_Warnings warnings (6 s apart) and bans for 15 minutes - with ServerLimit = 1 the script follows that
; rule and tells the player how close he is (LimitText: {ping}, {limit}, {seconds}). WarnPing: a player whose average
; is higher is told (WarnText) at most every WarnEverySeconds (0 = never). IgnoreAdmins = 1: the admins are left
; alone. /lag (admins): every player measured, the worst first; !track shows the spread and the warps too.
; The spectators (all three 0 = never): a player whose average is over SpecPing, or the spread over SpecJitter, or
; with more than SpecWarps warps a minute for SpecSeconds goes to the spectators (SpecText to everybody) - only with
; MinPlayers players or more, in a survival round only when he is dead; !j answers WaitText until his average stays
; under ResumePing for ResumeSeconds. Tokens: {player} {ping} {jitter} {max} {warps} {limit} {seconds}.
