[Points]
; Battle points (the Battlefield mod's score): a score of its own for the map, with a feed - the game's kills and
; ZitroStats stay as they are. Every value is the points of one event (0 = none; a negative value takes points).
; Damage: per percent of a full health done to an enemy (a whole health: 100); Kill: on top of that for a kill;
; TeamDamage: per percent done to a team mate; Headshot (the killing hit on the head), Assist (everybody else who
; did AssistPercent of a health to the one killed), FirstBlood (the map's first kill), SelfKill (not the end of a
; survival round, not the server's own kills), Distance (a kill farther than DistanceFrom px: DistanceBase + 1 per
; DistanceStep px more, times the class's distance perk), Savior (killing the one who hurt a mate within
; SaviorSeconds), Revenge (killing your last killer), Posthumous (a kill after your death), MultiKill (kills no
; more than MultiSeconds apart: the 2nd|3rd|4th|5th|6th and more), FlagGrab (from its base), FlagScore,
; FlagReturn, Revive ([Downed]: a mate got up), TeamRespawn (a mate came back at your rally), AmmoGiven (per
; AmmoEvery magazines given to mates), Healed (per HealEvery percent of a health given), Repaired (per RepairEvery
; vest), KitTaken (a mate took your kit), KitEnemy (an enemy did), KitPlaced, StatgunPlaced, SpotKill (an enemy you
; spotted killed by a mate), BountyCollected ([Bounty]), CrateOpened (a mate opened the crate of your supply
