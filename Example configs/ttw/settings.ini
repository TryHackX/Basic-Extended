[Bleeding]
; Wounds and blood. A hit may open a wound: the chance grows with the damage (CritChance at CritDamage percent
; of ReferenceHealth, less for smaller hits) and with the place it hit - the head, the torso or the legs,
; found on the soldier's skeleton the way the server finds it (HeadFactor, TorsoFactor, LegsFactor); a blade
; cuts deeper (MeleeFactor), a blast opens up to BlastWounds shrapnel wounds, fire and fists open none. A
; light wound (a graze) stops by itself (after a random time up to GrazeSeconds with GrazeRandom = 1), a heavy
; one bleeds until it is bandaged, an arterial one (ArterialShare of the wounds, more at the neck and the
; thigh) bleeds fast; the rates are percent of the blood a second. The blood (100 at spawn) runs out at the
; sum of the open wounds and comes back by BloodRegen a second BloodRegenDelay seconds after the last wound
; closed. Below WeakBlood the health drains (Drain percent of the maximum health a second at DeathBlood, less
; above it) and, with RegenBlock = 1, [Regeneration] waits while a wound bleeds and brings the health back
; only up to the blood's share; below ShockBlood every ShockCheckSeconds a shock may come (ShockChance percent
; at DeathBlood, a quarter of it just below ShockBlood; the next check ShockCheckSeconds after a shock ended):
; ShockSeconds frozen with a black screen (in the air he falls), his shots taken out; at DeathBlood he bleeds
; out: BleedOut = drain - while a wound bleeds his health drains faster and faster (OutDrain percent of the
; maximum health a second more than Drain, OutDrainGrow more for every point of blood under DeathBlood; OutText
; in the middle of his screen), so a bandage or a kit still saves him; instant - at once. Down with [Downed],
; else dead, the kill the one's who opened his worst wound, with that weapon. A soldier who is down or in shock
; fires nothing (the server's bullets of his are taken out).
