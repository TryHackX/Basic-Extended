[Admin]
; The players of Steam-1, Steam-2 ... (a Steam id in any form at the start, the rest of the value is a
; comment - a name) become admins once Steam confirms them - an HWID can be faked, a Steam account
; cannot. Soldat keeps admins by IP: the server writes the IP into remote.txt; the script takes it out
; again when the player leaves (only an IP it put there itself, listed in data/granted_admins.txt).
; /steamadmin - the list; /steamadmin add|del <player or Steam id> writes the Steam-N lines of this
; section. Only from the server console, a TCP admin or a Steam admin.
SteamAdminCommands = steamadmin
; The list shown by /admincommands: the Line-N lines of [AdminCommandList] (padded to [CommandList]
; PadTo)
ListCommands = admincommands
; /be_prof: how long each part of the script's tick takes (/be_prof on|off|reset)
ProfileCommands = be_prof
IpCommands = ip
HwidCommands = hwid
; /banr <id> <time> <reason>, /banhwr <time> <hwid> <reason>, /banipr <time> <ip> <reason>;
; time = number + m, h, d, mon or y
BanCommands = banr|banrange|bantime
BanHwidCommands = banhwr
BanIpCommands = banipr
; longest ban in minutes (0 = no limit) and 1 = a longer one is shortened, 0 = refused
MaxBanMinutes = 129600
ShortenLongBans = 1
KillAllCommands = killall
KickAllCommands = kickall
ExplodeAllCommands = explodeall
; /killall and /kickall leave the admins alone (1) or not (0)
KillAllSkipsAdmins = 0
KickAllSkipsAdmins = 1
; Every command that takes a player takes: an id, a name or a part of it ("in quotes" with spaces),
; me, all, others (everybody but you), alpha, bravo, charlie, delta, spec, bots or humans.
; /explode <player> [kind], /god [player] (no damage), /heal <player>, /slap <player> [damage],
; /freeze <player> (again = free), /bring <player> (to you), /goto <player>, /disarm <player>,
; /give [near] <player> [ammo] <weapon> - weapon: usp deagle mp5 ak aug spas ruger m79 barrett minimi
;   minigun knife chainsaw law flamer bow flamebow or 0-16; ammo = rounds in the magazine (at most a
;   full one); near = the weapon drops next to the player instead,
; /bonus [near] <player> <predator|berserker|vest|nades|clusters|flame|medkit or 1-7> - given at once
;   (near: the kit drops next to the player),
; /statgun [player] - a stationary gun next to you (or the player); /removestatgun [all] - the one
;   nearest to you (or all of them),
; /infammo <player> - infinite ammo on/off (the magazine is filled again, a thrown knife comes back),
; /dmgfix <player> <+n%|-n%|n%|xN|off> - the damage the player's bullets do (+20% = 120%),
; /dmgtaken <player> <...> - the damage the player takes (both together multiply),
; /vest <player> [0-100] - body armour.
; The server itself bans a player for a day for a bow outside Rambo mode, admins too ("Not allowed
; weapon"), so /give refuses it. A server with sv_bonus_flamer 1 does the same for a flamer (also the
; flame god bonus); set GiveFlamer = 1 when yours has sv_bonus_flamer 0.
; Kinds of /explode (and /explodeall [kind]): plain, big (a big blast with rings of explosions,
; shrapnel and fire), nuke (three rings of blasts and rockets falling from the sky), law (rockets from
; six sides), m79 (shells from above), arrows, firearrows, bullets, spas (shotgun shells from four
; sides), flame, cluster, nades (a fan of grenades), knives, rain (bullets from the sky).
; /bigexplode <player> = /explode <player> big, /nuke <player> = /explode <player> nuke.
; ExplodePower (0.1-10) multiplies the damage of every kind. Script bullets never fill the game's 254
; bullet slots (32 are kept free), and no object is made when fewer than 4 of the 90 slots are free.
ExplodeCommands = explode
BigExplodeCommands = bigexplode|boom
NukeCommands = nuke
ExplodePower = 1
GodCommands = god
HealCommands = heal
SlapCommands = slap
SlapDamage = 15
FreezeCommands = freeze
BringCommands = bring
GotoCommands = goto
DisarmCommands = disarm
GiveCommands = give
BonusCommands = bonus
GiveFlamer = 0
StatgunCommands = statgun|sg
StatgunRemoveCommands = removestatgun|delstatgun
InfAmmoCommands = infammo|infiniteammo
DamageCommands = dmgfix|dmgmod
DamageTakenCommands = dmgtaken
VestCommands = vest
; /speed <player> [1.1-5|off] [all|ground|jump] - run and fly faster (2 = twice as fast; without a
; number: on with SpeedDefault, again = off). Running is pushed up to SpeedRunPixels a tick times the
; factor (the game runs at about 3.9; 11 at most). The kind (SpeedMode when not given):
;   all    - on the ground and in the air, jets get SpeedJetPush more a tick for every step of the factor;
;   ground - only on the ground: a jump keeps the speed it had, nothing more is added in the air;
;   jump   - like ground, and the jump off the ground is stronger by SpeedJumpShare of the factor.
SpeedCommands = speed|speedhack
SpeedDefault = 2
SpeedMode = all
SpeedRunPixels = 3.9
SpeedJetPush = 0.1
SpeedJumpShare = 0.5
; /sayas <player> <text> - everybody reads the text as that player's chat line ("[name] text", the
; chat colour); /sayteam <player> <text> - only that player's team, as team chat. The admin who did
; it is written to the server console. The colours are those of the game's chat.
SayAsCommands = sayas
SayTeamCommands = sayteam|sayteamas
SayAsColor = $EFFEEA
SayTeamAsColor = $FEDA7C
SayAsSpectatorColor = $DF7AB0
; /slay <player> - kills at once (counts as a suicide, like /kill); /killall kills everybody
SlayCommands = slay
RandomizeCommands = randomize
ReloadCommands = reloadsettings|be_reload
; what the script sent in the last minutes (health texts, damage numbers, heals, bullets looked at)
StatusCommands = be_status
; Testing aids, only from the server console or a TCP admin connection:
; /be_test <player id> <chat line or /command> runs it as that player, the answers also go to the
; console; /be_bench measures the bullet scan, the kit sweep, a property read, the snapshot of the
