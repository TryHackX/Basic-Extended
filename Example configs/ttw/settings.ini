; KitRadius pixels gets it when he misses something (the game lets him take one only with no grenade).
; [Kits] GrenadeKits = 1 removes the kits from the maps.
KitNades = 2
KitFlashes = 1
KitRadius = 20
; The type chosen after a respawn: nade or flash
