BotFlashChance = 0.3
; Keys that switch the type, all at once (a new press): key names joined by + (crouch, prone, reload,
; fire, jet, grenade, changeweapon, throw, flagthrow, up) or none. crouch+changeweapon also changes the
; weapon (as in the old script); flagthrow alone is a free key when nobody carries a flag.
SwitchKey = crouch+changeweapon
; Commands (with ! or /): SwitchCommands the other type, NadeCommands a normal grenade, FlashCommands a
; flash - typed again it is a normal grenade again (flash on/off), HelpCommands the help. The shortest
; flash command and SwitchKey are the {switch} of the texts below. /smoke and /tabac are the game's own
; taunts (Alt+1 and Alt+2 by default): the soldier still smokes or chews. With [Classes] on, the words of its
; SkillCommands and Skill2Commands are the skills' (cc1, smoke, cc2, tabac by default) - in a game mode where
; the classes are idle they switch the grenade type as before.
SwitchCommands = set|change
NadeCommands = nade|n|cc1|smoke
FlashCommands = flash|fla|f|cc2|tabac
HelpCommands = flashhelp
; Whom a flash blinds: all (everybody, its thrower too), enemies (not the team mates, not the thrower)
; or enemiesself (the enemies and the thrower)
Affects = all
; Radius in pixels (14 = a metre, measured to his eyes); the white screen lasts MinTicks to MaxTicks (60 =
; a second): MaxTicks next to the flash, MinTicks at Radius. Falloff (1-8): 1 = it gets shorter evenly
; with the distance, higher = it stays near MaxTicks further out and drops only towards the edge (3: at
; half the Radius still 7/8 of the way to MaxTicks). The last 1.3 s of the time the white fades; a time
; under 1.3 s (far away) starts already fading - shorter and softer.
Radius = 260
Falloff = 3
MinTicks = 60
MaxTicks = 240
; Turned away from the flash (the cursor on the other side): this share of the time (1 = no difference)
BehindShare = 1
; The white screen: Method 1 = a BigText over the screen (BigLayer, BigScale, BigX, BigY; a very wide
; screen may keep an edge), 2 = a WorldText around the player that covers any screen (WorldLayer,
; WorldScale, WorldOffsetX, WorldOffsetY from his position). Char is the giant letter, Color its colour
; ($AARRGGBB takes a transparency too).
Method = 2
Char = +
Color = $F1F1F1
BigLayer = 250
BigScale = 60
BigX = -5000
BigY = -6420
WorldLayer = 250
WorldScale = 1280
WorldOffsetX = -82304
WorldOffsetY = -136832
; 1 = a flash is taken out of the server (the bullet memory bridge) when its fuse ends or a tick before
; it would touch a soldier: the server has no blast, so it neither hurts nor pushes anybody, and the
; flash does its work from the script. A bot's grenade thrown at point blank goes off before the script
; sees it: then the damage below replaces the grenade's and NoPush holds the players. 0 = every flash
; explodes in the server too (the damage below replaces the grenade's, NoPush holds the players).
Defuse = 1
; A flash's own damage: at most MaxDamage, only within DamageRadius pixels (85 = the grenade's own blast),
; less further out, nothing through a wall; 0 = none
MaxDamage = 0
DamageRadius = 85
; 1 = the players within NoPushRadius pixels of a flash are held where they stood for NoPushTicks and
; then get their speed back: a human's own game shows the explosion and pushes him (a taken out flash
; does not push bots). He may see a short jump back.
NoPush = 1
NoPushTicks = 3
NoPushRadius = 110
; A bot a flash blinds (bots never see texts): 0 = nothing, 1 = it stands still for most of that time,
; 2 = it staggers about (a few steps this way and that, a crouch, a jump) and does not shoot
BlindBots = 1
; Marks of the grenades in the air (LabelFlash, LabelNade; empty = none): one character is drawn with
; its ink centred on the grenade's picture, MarkScale big (O = a ring around it: 8.5 x 7 pixels at 0.06,
; 10 x 8 at 0.07); the game draws the grenade about 2 pixels above its position, so the mark's centre is
; MarkOffsetX, MarkOffsetY pixels from that position. A longer word stands over the grenade (LabelScale,
; LabelOffsetY). Seen by LabelsSeenBy: all, team (the thrower and his team) or owner (only the thrower);
; with LabelLineOfSight = 1 an enemy sees it in the realistic mode only when he could see the grenade.
; Moved every LabelTicks (1 = smoothest, more packets) on WorldText layers LabelLayerFirst ... +
; LabelLayers - 1. The thrower's game has his grenade about his ping earlier than the server: his own
; mark goes that far ahead while it flies. Each game moves its grenades itself, so after bounces a
; grenade may lie a pixel or two away from the server's (and its mark).
Labels = 1
LabelsSeenBy = team
LabelLineOfSight = 1
LabelFlash = O
LabelNade =
LabelFlashColor = $CDCDCD
LabelNadeColor = $CC0000
MarkScale = 0.06
MarkOffsetX = 0
MarkOffsetY = -2
LabelScale = 0.038
LabelOffsetY = 7
LabelTicks = 1
LabelLayerFirst = 80
LabelLayers = 8
; The type and the grenades left on the screen (a BigText). Tokens: {type} {nades} {flashes}.
; HudPlace = ammo: right over the player's ammunition text, where and as big as he has it (!ammohud), or
; over his health text when the ammunition has no text of its own; fixed = at HudX, HudY, HudScale.
Hud = 1
HudPlace = ammo
HudText = Grenade: {type} | Nades: {nades} | Flash: {flashes}
TypeNade = Nade
TypeFlash = Flash
HudLayer = 195
HudX = 20
HudY = 412
HudScale = 0.02
HudColor = $D9D5D1
; The colour of !flashhelp and of the answers
TextColor = $ADC600
; Told to a player who joins (empty = nothing), and JoinBigText shown big for JoinBigSeconds (0 or an
; empty text = not; empty here - JoinText says it in the chat, e.g. JoinBigText = Flash grenade:
; {switch}). Tokens: {switch} (how the type is switched: SwitchKey or the shortest flash command),
; {nades} {flashes} (a life's)
JoinText = Flash grenades here: {switch} switches between a grenade and a flash. More: !flashhelp
JoinBigText =
JoinBigSeconds = 2.5
JoinLayer = 194
JoinScale = 0.09
JoinX = 55
JoinY = 295

[ExtraRocket]
; Guided rockets (the owner's ExtraRocket script), Javelin style: a player holding a loaded Weapon (the
; LAW) on the ground keeps Keys down; the sight looks for an enemy he can see within Range, near his
; cursor (Target = radius), and once it has one it locks on him in LockSeconds - the cursor is free then,
; letting go of the keys ends it. The rocket leaves the tube slowly, its motor starts and it flies after
; him: the library (basicext_dll) flies it like a guided missile - thrust against a drag, fins that turn
; it at most Agility sideways (slow it turns tight, fast it turns wide), proportional navigation that
; leads a running target, a look-ahead that finds walls and throttles back to turn round them; with room
; above it climbs over the target and dives on him. At the target (or another enemy on its way) it
; bursts: a column of real LAW rockets along the line from the launch - the kill list shows the LAW,
; and "You killed" the distance and time from the launch - and, with BlastSparks, the old script's rings
; of stationary gun bullets. The one it locks on is warned (LockWarning). Each player has Rockets of
; them for a life (Refill = life) or a map (Refill = map); a team change brings them back. !rocket explains
; it with these settings.
Enabled = 0
; The rocket's name in the texts ({name})
Name = Javelin
Rockets = 1
Refill = life
; Keys held at once (names as [FlashNades] SwitchKey); lying counts as crouch (crouch would get a lying
; soldier up). Without fire the LAW does not fire its own round (reload does nothing to a loaded LAW);
; with fire in them and Launcher = free the weapon is given anew while the sight locks, so its own
; start-up begins again.
Keys = crouch+reload
; 1 = only on the ground (as the LAW itself)
Ground = 1
; The weapon in the hands (a name or number: law, 13)
Weapon = law
; reload = the weapon has to be loaded; the rocket leaves from it, it is empty and reloads, and its round
; comes back at the reload (with [Ammo] the reserve stays); round = the same, but the round goes into the
; rocket (the reload takes one from the reserve); free = the weapon is not touched
Launcher = reload
; Where the sight looks: radius = the enemy nearest to the cursor within CursorRadius pixels of it,
; cursor = the one nearest to the line of the cursor within CursorAngle degrees, nearest = the nearest
; one; in sight and within Range. SeekSight = 1: while it looks (radius) the shooter sees the seeker's
; brackets around his cursor, SeekWidth pixels wide (0 = as wide as the circle, 2 x CursorRadius), in
; SeekColor
Target = radius
Range = 700
CursorRadius = 150
CursorAngle = 70
SeekSight = 1
SeekWidth = 200
SeekColor = $D8D8D8
; Blinded by a flash ([FlashNades]) a player cannot lock until BlindLockSeconds before his white screen
; ends (it fades then); a lock that runs ends
BlindLockSeconds = 0.25
; The lock: the keys stay down this long while brackets close on the target (seen by the shooter,
; WorldText layer LockLayer, LockScale big, LockColor) and LockSound beeps quicker and quicker; the
; target lost from sight, out of range or dead ends it. 0 = the rocket leaves at once.
LockSeconds = 0.4
LockScale = 0.16
LockLayer = 90
LockColor = $FF3030
; The flight (pixels, a tick = 1/60 s; the game's gravity is 0.06): out of the tube at EjectSpeed, the
; motor starts after EjectSeconds; Thrust speeds it up to about MaxSpeed; Agility = the most sideways push
; of its fins (the turn rate is Agility / speed); a turn costs TurnDrag of that push in speed; Gravity
; pulls it down (the motor holds it while it burns); Lead = how far ahead of a running target it aims
; (0 = straight at him, 3 = proportional navigation); FuelSeconds of motor, then it glides GlideSeconds
; (weaker fins, falling) and bursts.
EjectSpeed = 4
EjectSeconds = 0.15
MaxSpeed = 16
Thrust = 0.9
Agility = 1.1
TurnDrag = 0.35
Gravity = 0.06
Lead = 3
FuelSeconds = 3
GlideSeconds = 1
; Profile: direct = straight at him, top = over him and down when there is room, auto = top when he is at
; least 220 pixels away (and not well above), else direct. TopHeight = the highest it climbs over the
; higher of the two (less under a ceiling).
Profile = auto
TopHeight = 220
; 1 = it looks LookAheadSeconds of flight ahead: a wall there makes it turn to the freer side and
; throttle back by up to Brake (0-1) to turn tighter - too fast, it still hits the wall
AvoidWalls = 1
LookAheadSeconds = 0.2
Brake = 0.6
; The rocket reaches the target within HitRadius pixels of its path; any other enemy it passes within
; ProximityFuse pixels makes it burst too (0 = only the target). HitPercent = the share of his health
; he loses before the burst (never the last point; 0 = only the burst - the final LAW rocket kills)
HitRadius = 25
ProximityFuse = 18
HitPercent = 0
; The power of the burst (1 = the LAW's own damage from weapons.ini), the stationary gun sparks on or
; off
BlastPower = 1
BlastSparks = 1
; The trail while the motor burns: a harmless flame every TrailSpacing pixels of the way (0 = none),
; drifting with TrailSpeed of the rocket's speed
TrailSpacing = 22
TrailSpeed = 0.25
; The next rocket of a player not sooner than CooldownSeconds; at most MaxFlying rockets in the air (1-16)
CooldownSeconds = 1
MaxFlying = 6
; The sounds - the sight waking up (law-start), the launch (m79-fire), the motor starting (law) and
; running (rocketz) - heard within SoundRange pixels
Sound = 1
SoundRange = 900
; The lock tones, each switched on or off by itself: ShooterBeep = 1 - the shooter hears LockSound while
; the sight closes on his target; TargetBeep = 1 - the one it locks on hears WarnSound (with
; LockWarning = 1). Both beep quicker and quicker as the lock closes, the target's fast while the rocket
; flies at him. Any sound of the game's sfx folder (signal.wav, regenerate.wav, shell.wav, shell2.wav,
; menuclick.wav, ...)
ShooterBeep = 1
LockSound = signal.wav
TargetBeep = 1
WarnSound = signal.wav
; 1 = bots fire them too (only when their keys happen to match; for tests)
Bots = 0
Commands = rocket|rockets
; Next to the ammunition while the weapon is in the hands (with [Ammo] HudAppend = 2 in its own text,
; else after the ammunition or the health): HudText with rockets left, HudEmptyText with none (empty =
; nothing). Tokens below.
HudText = ({left}/{max} {name})
HudEmptyText = (Empty {name})
; LockWarning = 1: the one a Javelin locks on sees the sight closing on himself (WorldText layer
; LockLayer + 1), LockWarnText over his head (layer WarnLayer, WarnScale big, WarnColor) and hears
; WarnSound (TargetBeep); while the rocket flies at him IncomingText blinks there
LockWarning = 1
LockWarnText = !! {name} LOCK !!
IncomingText = !! INCOMING {name} !!
WarnLayer = 92
WarnScale = 0.07
; Messages: tokens {player} (the shooter) {target} {name} {weapon} {keys} {used} {left} {max}; empty =
; nothing. WarnText goes to the target (chat).
WarnTarget = 1
WarnText = [WARNING] {player} fired a {name} at you!
FireText = [{name}] Locked on {target} - away! ({left}/{max} left)
NoTargetText = [{name}] No enemy in the sight.
BlindText = [{name}] You cannot see!
LostText = [{name}] Lock lost.
EmptyText = [{name}] None left! (0/{max})
NotLoadedText = [{name}] The weapon is not loaded.
Color = $33CC33
WarnColor = $FF0000
; A line to everybody every HintMinutes (0 = never)
HintMinutes = 5
HintText = Guided {name}: hold the {weapon} and press {keys} - see !rocket

[TeamKill]
; The team kill guard (the owner's old tk script, grown up). Every hit on a team mate and every team kill
; gives points by how meant it looked: the library follows the line of every shot (the hook in the
; server's CreateBullet, [Debug] ServerHooks = 1) against the soldiers' skeletons - a shot at a mate with
; no enemy near its line is aimed at him, with an enemy near or behind him it is crossfire, a blast with
; enemies next to the mate is an accident, a knife is always meant. The points climb a ladder (a warning,
; the fire at the team blocked and turned back on the shooter, a slay, a kick, bans that grow) and melt
; away with time; the record follows the player by his Steam id. A spray - several shots aimed at the
; same mate in a moment, no enemy near - blocks his fire at the team at once, before anybody dies. The
; victim decides about the kill (!1 forgive, !2 kill him, !3 points, !4 next round in survival). !tk shows
; a player his record, /tk <player>, /tklist and /tkreset are for the admins; every event goes to Log (in
; the data folder).
; SET ttw: the team-kill guard in the team modes
Enabled = 1
; Game modes it works in (dm pm tm ctf rm inf htf); it also needs the server's friendly fire on (nobody
; can hurt his team without it). RealisticOnly = 1: only in realistic mode.
Modes = tm|ctf|inf|htf
RealisticOnly = 0
; 1 = bots are counted and punished too (normally they are left alone; never banned, only kicked)
Bots = 0
; --- the points ---
; A whole health of damage to the team gives DamagePoints, a team kill KillPoints, a spray SprayPoints -
; each times how meant it looked (aimed at the mate 90-100%, crossfire and a mate who ran into the fire
; 20%, a blast near enemies 10%, a blast with no enemy near 60%, a knife 100%)
DamagePoints = 1
KillPoints = 1
SprayPoints = 1
; A team kill within SpawnSeconds of the mate's respawn counts SpawnFactor times, of a flag carrier
; FlagFactor times; killing back the one who team killed you within RevengeSeconds counts RevengeFactor
; times (0 = free)
SpawnSeconds = 5
SpawnFactor = 1.5
FlagFactor = 2
RevengeSeconds = 10
RevengeFactor = 0
; One point melts away every DecayMinutes (0 = never), starting DecayAfterSeconds after his last points;
; DecayOffline = 1: between his visits too (by the clock - a ban melts points as well), 0: only while he
; is on the server. KeepPoints = 1: the points, bans and team kills follow the player by his Steam id
; (players.bdb); ResetOnMapChange = 1: every map starts clean (the old script)
DecayMinutes = 10
DecayAfterSeconds = 10
DecayOffline = 1
KeepPoints = 1
ResetOnMapChange = 0
; --- the ladder: a step is taken when his points reach it (0 = the step is off) ---
; WarnAt: a warning; ShieldAt: his shots at the team are blocked (below); SlayAt: slain (dead in
; survival: after his next respawn); KickAt: kicked; BanAt: banned
WarnAt = 0.5
ShieldAt = 1.5
SlayAt = 2.5
KickAt = 4
BanAt = 5
; The block: his hits on the team do ShieldShare of their damage (0 = nothing) and MirrorShare of it hits
; him instead - for ShieldSeconds after a spray or a step, and all the time his points are at ShieldAt
ShieldSeconds = 90
ShieldShare = 0
MirrorShare = 1
; A ban lasts BanMinutes, twice as long every next time with BanDouble = 1, at most BanMaxMinutes. Every
; BanForgetDays days without a ban the count of his bans goes one down (0 = never), so the next ban is
; shorter again (/tkreset <player> bans clears it at once)
BanMinutes = 15
BanDouble = 1
BanMaxMinutes = 1440
BanForgetDays = 7
; --- the shots ---
; A spray: SprayShots shots aimed at the same mate within SpraySeconds, at least SprayShare of all his
; shots then, none of them crossfire
Spray = 1
SprayShots = 5
SpraySeconds = 1.5
SprayShare = 0.6
; A shot that passes within LineRadius pixels of a soldier's body goes at him; an enemy within
; EnemyRadius pixels of its line makes it crossfire; a blast with an enemy within BlastEnemyRadius pixels
; of the mate is an accident
LineRadius = 10
EnemyRadius = 45
BlastEnemyRadius = 150
; --- the victim decides (the old script's menu), within VoteSeconds ---
; forgive = the kill's points (and his damage to you in that life) go away; punish = he is slain now
; (dead in survival: after his next respawn) and gets PunishPoints; points = only PunishPoints; next round
; (survival) = slain after his next respawn and PunishPoints. !tk 1-4 works too (the old /tk 1-4).
Vote = 1
VoteSeconds = 20
PunishPoints = 0.5
ForgiveCommands = 1|forgive
PunishCommands = 2|punish
PointsCommands = 3
NextRoundCommands = 4|nextround
; !tk: a player's own record (admins: /tk <player>); /tklist: everybody with points; /tkreset <player|all>
; [bans]: the points (and the bans) go
Commands = tk|banpoints
ListCommands = tklist
ResetCommands = tkreset
; --- the texts; tokens: {player} (the one it is about) {victim} {killer} {points} {max} (BanAt) {why}
; {shots} {seconds} {minutes}; empty = nothing. The big ones on BigText layer BigLayer for BigSeconds ---
Color = $FF6060
InfoColor = $FFB0B0
BigLayer = 191
BigScale = 0.09
BigX = 60
BigY = 240
BigSeconds = 4
HitText = Watch your fire - {victim} is on your team! ({points} team kill points)
WarnText = Team kill points: {points} of {max}. Hurting your team leads to a ban.
ShieldText = Your shots at the team are blocked for {seconds} s - and hurt you instead.
ShieldTeamText = {player} hurts his team: his shots at the team are blocked now.
SprayText = Stop shooting at {victim}! ({shots} shots at him) Your fire at the team is blocked.
SprayVictimText = {player} was shooting at you - his fire at the team is blocked.
KillText = You killed your team mate {victim} ({why}): {points} team kill points of {max}.
VictimText = Team killed by {killer} ({why}). Within {seconds} s: !1 forgive, !2 kill him, !3 points only
VictimNextText = , !4 kill him next round
SlayText = You were slain for team killing ({points} points).
NextRoundText = You will be slain after your next respawn for team killing.
KickText = {player} was kicked for team killing ({points} points).
BanText = {player} was banned for {minutes} minutes for team killing ({points} points).
; The events (team kills, sprays, steps, decisions) with the reasons, a line each (empty = none)
Log = teamkill.log

[Mines]
; Landmines and claymores (the owner's old Mines script, grown up). Enemy kills and captures earn them; a
; player plants one with keys or a command. A landmine lies hidden from the enemies and goes off under
; the first enemy who steps on it (jumping or jetting over it is safe); a claymore is seen by everybody,
; looks where its owner looked, and when an enemy walks into its tripwire it throws a cone of shells
; that way (a little all around it too). An enemy who crouches or lies near a landmine finds it and can
; take it apart; an enemy bullet sets a claymore off; the owner picks his own back up. The library looks
; after them every tick against the soldiers' skeletons as the server has them (the memory bridge); the
; marks are WorldTexts. !mines shows a player what he has; /minelist, /mineclear, /givemines are for the
; admins.
; SET ttw: landmines and claymores in the trenches
Enabled = 1
; Game modes it works in (dm pm tm ctf rm inf htf)
Modes = dm|pm|tm|ctf|rm|inf|htf
; The two kinds, each on its own
Landmines = 1
Claymores = 1
; 1 = bots earn them too and plant them at random moments (BotChance a second, on the ground)
Bots = 1
BotChance = 0.15
; --- earning ---
; Every KillsPerMine enemy kills give a landmine, every KillsPerClaymore a claymore (0 = none for kills).
; KillStreak = 1: only the kills of one life count (a death starts again); MineKills = 1: kills by mines
; and claymores count too
KillsPerMine = 3
KillsPerClaymore = 5
KillStreak = 0
MineKills = 0
; A capture gives CaptureMines and CaptureClaymores; every life starts with SpawnMines and SpawnClaymores
; at least
CaptureMines = 1
CaptureClaymores = 1
; SET ttw: mines from the classes and the shop
SpawnMines = 0
; SET ttw: claymores from the classes and the shop
SpawnClaymores = 0
; The most a player carries; KeepOnMapChange = 1: what he carries and his kills stay for the next map
MaxMines = 2
MaxClaymores = 2
KeepOnMapChange = 0
; --- planting ---
; Keys: names joined by + (crouch prone reload fire jet grenade changeweapon throw flagthrow up; none =
; only the commands). flagthrow is the game's throw of the flag: jump and crouch together (or the
; player's own throw flag key), which without a flag does nothing; a quick tap does not jump. The
; claymore's keys are tried first: by default lying down plants a claymore, standing or crouching a
; landmine (the other kind when he has none of that one)
MineKeys = flagthrow
ClaymoreKeys = prone+flagthrow
MineCommands = mine
ClaymoreCommands = claymore|clay
InfoCommands = mines
ListCommands = minelist
ClearCommands = mineclear
GiveCommands = givemines
; Only on the ground, FlagDistance px from his team's flag base and SpawnDistance px from the enemies'
; spawn points (with a wall between they do not count), Spacing px from any other mine, one every
; PlantSeconds
FlagDistance = 130
SpawnDistance = 110
Spacing = 30
PlantSeconds = 1
; The most in the ground at a time: a player's landmines, a player's claymores, the map's (both kinds)
MaxPlanted = 2
MaxPlantedClaymores = 2
MaxOnMap = 20
; Armed ArmSeconds after planting; gone after LifeSeconds (0 = until the map ends): ExpireBlast = 1 it
; goes off then (the old script), 0 it goes quietly. A player's mines go when he leaves or changes team.
ArmSeconds = 2
LifeSeconds = 0
ExpireBlast = 0
; --- the landmine ---
; An enemy's leg or body within TriggerRadius px of it sideways and at most TriggerHeight px above it
; sets it off (a soldier jumping over it passes, one crawling over it not); it goes off FuseSeconds
; later (0 = at once) with ClickSound heard near it
TriggerRadius = 16
TriggerHeight = 8
FuseSeconds = 0
ClickSound =
; The blast: Blasts M79 explosions in the ground spread over BlastSpread px (each kills within about 10
; px and hurts up to 64), and Shrapnel shells up in a cone of ShrapnelAngle degrees each side at
; ShrapnelSpeed (a Spas-12 shell flies 14), each ShrapnelPower times a Spas-12 shell
Blasts = 2
BlastSpread = 12
Shrapnel = 6
ShrapnelAngle = 35
ShrapnelSpeed = 12
ShrapnelPower = 0.7
; --- the claymore ---
; Fuse = wire: a tripwire along the ground ahead of it, WireHeight px high, WireLength px long (a wall
; ends it) - an enemy's leg or lying body on it sets it off, jumping over it is safe; Fuse = cone: any
; enemy in its front cone (ConeAngle degrees each side, ConeRange px) with nothing between. Anybody
; hostile within TouchRadius px sets it off from any side.
Fuse = wire
WireLength = 110
WireHeight = 5
ConeAngle = 30
ConeRange = 140
TouchRadius = 14
; The blast: Pellets shells in a cone of Spread degrees each side of where its owner looked (tilted at
; most MaxTilt degrees from level) at PelletSpeed, each PelletPower times a Spas-12 shell (1.5: a soldier
; at the end of the wire loses more than his health); around and behind it BackPellets weaker shells
; (BackSpeed, BackPower); Blast M79 explosions at it (they kill within about 10 px and hurt up to 64; only
; where the ground stops bullets - a floor only the players stand on lets them through) and Flames
; flames that hurt nobody fanned out in its cone, the flash of the blast; BlastSound is heard up to 900 px
; away
Pellets = 20
Spread = 20
MaxTilt = 30
PelletSpeed = 16
PelletPower = 1.5
BackPellets = 8
BackSpeed = 7
BackPower = 0.4
Blast = 1
Flames = 8
BlastSound = grenade-explosion
; --- both ---
; Another mine within ChainRadius px (0 = never) goes off ChainSeconds after one
ChainRadius = 70
ChainSeconds = 0.15
; A dead soldier's body that falls or slides onto a landmine, onto a claymore or across its tripwire
; sets it off (a claymore's cone looks for the living only): Corpses = enemies (the bodies of the ones
; who would set it off alive), all (anybody's, the owner's team too) or off. A body lying there already
; when the mine was armed does not. The bodies are their skeletons (the memory bridge)
Corpses = enemies
; An enemy's bullet (the hook in the server's CreateBullet, [Debug] ServerHooks = 1) passing within
; HitRadius px of a claymore sets it off (ShootMines: a landmine too); ShooterKills = 1: its kills are
; the shooter's, 0: its owner's
ShootClaymores = 1
ShootMines = 0
HitRadius = 7
ShooterKills = 1
; --- finding and taking apart ---
; An enemy crouching or lying within SpotRadius px of a landmine, with his eyes on it, finds it: he sees
; its mark from then on, with SpotShare = 1 his team too (0 = never found). Crouching or lying within
; DefuseRadius px of a mine he sees (not on it!) for DefuseSeconds takes it apart (0 = never);
; DefuseTake = 1: it is his then. The owner picks his own up the same way in PickupSeconds (0 = never).
SpotRadius = 70
SpotShare = 1
DefuseRadius = 40
DefuseSeconds = 2
