[FlashNades]
; Flash grenades (the owner's FlashNades script). Every life brings Nades grenades and Flashes flash
; grenades; a player chooses what his next grenade is (SwitchKey or the commands below) and the grenade
; he throws becomes that one (the hook in the server's CreateBullet reports every throw at once). While
; this is on, the server's Max_Grenades is 1: a soldier carries one grenade, and the script gives the
; next one right after it was thrown (with the game's grenade kit sound), as long as he has any left; the
; server's own value comes back when it is switched off. A flash is a grenade the script takes out of
; the server just before it goes off (Defuse): the server has no blast - no damage, no push - while the
; players' games still show the explosion, and everybody who sees it (no wall between it and his eyes -
; the middle of his head as the server's skeleton has it: standing, crouching, lying or rolling) within
; Radius gets a white screen for MinTicks to MaxTicks (the nearer, the longer), which fades out by
; itself. !flashhelp explains it with the keys and commands set here.
