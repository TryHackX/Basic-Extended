[Insurgents]
; Insurgents (the owner's Taliban mod of 2014 with neutral names; off by default): one team - or both - fights as the
; insurgents, and every soldier of it wears a suicide vest. Modes: the team game modes it works in; Team: alpha,
; bravo or both; Name and EnemyName: the two sides in its texts.
; The vest: holding Keys (as [Mines]: flagthrow = crouch + jump or the throw-flag key; none = the command only) or
; /detonate (again = stop) counts HoldSeconds down - a beep (ArmSound, heard within SoundRadius px) and ArmText over
; him (ArmColor; ArmLayer: its WorldText layer) warn the ones near; letting the keys go stops it. Then it goes off:
; a blast inside every enemy within CoreRadius px of him that he can see, and the vest's pattern around him (Power
; scales its hits); he dies of it (no suicide's penalty, no grenade of [Posthumous]) and its kills are his.
; Pattern: classic, hawk, inferno, shrapnel, ring, scatter, ied, plain (one blast), random (a new one of the first
; seven every life) or none; with [Classes] a class's Vest key wins. KeysOverMines = 1: an insurgent's flagthrow keys set off the vest,
; not a landmine of [Mines] (lying, they are still the claymore's).
; Not in the first MinLifeSeconds of a life, not within SpawnDistance px of an enemy spawn point he can see (0 =
; anywhere), not with a flag (FlagCarrier = 1: also then), not while his team waits TeamCooldownSeconds after a vest
; of it went off. Killed while it counts down: DeadManChance % that it goes off anyway (HeadshotStops = 1: never after
; a headshot); DownedDetonate = 1: a downed insurgent ([Downed]) can still set it off.
; Bots = 1: an insurgent bot with BotMinEnemies enemies or more within BotRadius px that he can see, and no mate nearer
; than the nearest of them, sets it off - BotChance % each second.
; Texts: JoinText at his first vest ({faction}, {enemy}, {how}), Shout (said in the chat at the blast; empty = none),
; VictimText to the ones it killed ({name}: the bomber), BomberText to him ({kills}); Color: their colour.
; His line (Hud = 1; HudPlace = ammo: over the ammunition, in the stack; fixed: HudX, HudY, HudScale; HudLayer: its
; BigText layer): HudText with {state} - ReadyText, ArmingText ({seconds} left) or WaitText ({seconds}).
; Classes: the insurgents' classes ([Class-<name>] sections), played by the insurgents only while it is on - the
